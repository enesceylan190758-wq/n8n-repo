# Chatwoot — hazır WhatsApp inbox (Evolution native entegrasyon)
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.evolution.yml \
#     -f docker-compose.prod.yml -f docker-compose.chatwoot.yml up -d
#
# İlk kurulum: bash execution/setup-chatwoot.sh

services:
  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    container_name: nefalix-chatwoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?Set CHATWOOT_POSTGRES_PASSWORD}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    networks:
      - nefalix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 8

  chatwoot-redis:
    image: redis:7-alpine
    container_name: nefalix-chatwoot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${CHATWOOT_REDIS_PASSWORD:?Set CHATWOOT_REDIS_PASSWORD}
    volumes:
      - chatwoot_redis_data:/data
    networks:
      - nefalix-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CHATWOOT_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chatwoot-rails:
    image: chatwoot/chatwoot:v3.14.0
    container_name: nefalix-chatwoot-rails
    restart: unless-stopped
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    volumes:
      - chatwoot_storage:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?Set CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://evo.nefalix.com:8443
      FORCE_SSL: "false"
      DEFAULT_LOCALE: tr
      ENABLE_ACCOUNT_SIGNUP: "false"
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD}@chatwoot-redis:6379
      POSTGRES_HOST: chatwoot-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD}
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
      MAILER_SENDER_EMAIL: ${CHATWOOT_MAILER_SENDER:-Nefalix Chat <noreply@nefalix.com>}
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      - nefalix-net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v3.14.0
    container_name: nefalix-chatwoot-sidekiq
    restart: unless-stopped
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
      chatwoot-rails:
        condition: service_started
    volumes:
      - chatwoot_storage:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://evo.nefalix.com:8443
      FORCE_SSL: "false"
      DEFAULT_LOCALE: tr
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD}@chatwoot-redis:6379
      POSTGRES_HOST: chatwoot-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD}
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    networks:
      - nefalix-net

  caddy:
    environment:
      - CHATWOOT_PUBLIC_HOST=${CHATWOOT_PUBLIC_HOST:-chat.nefalix.com}
    depends_on:
      chatwoot-rails:
        condition: service_started

volumes:
  chatwoot_postgres_data:
  chatwoot_redis_data:
  chatwoot_storage:
