<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nefalix Saha CRM</title>
<link rel="icon" href="/assets/brand/favicon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#0B1220;      /* logo siyah-lacivert */
  --ink2:#151D2E;
  --line:#D8E0EF;
  --bg:#F4F7FC;
  --card:#FFFFFF;
  --txt:#151D2E;
  --mut:#6B7A8D;
  --brand:#2F6BFF;    /* logo elektrik mavi */
  --brand-d:#1F4FD6;
  --brand-soft:#E8EEFF;
  --accent:#22D3C5;   /* logo cyan uç */
  --accent-soft:#E6FAF8;
  --violet:#7C5CF5;
  --warn:#E8A317;
  --dang:#D64545;
  --info:#2F6BFF;
  --r:10px;
  --sh:0 1px 2px rgba(11,18,32,.06), 0 4px 14px rgba(11,18,32,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand-d);text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* ---------- ANA EKRAN (giriş öncesi) ---------- */
.logo{display:flex;align-items:center;gap:10px}
.logo .mark-img{width:34px;height:34px;border-radius:8px;background:#fff;padding:3px;object-fit:contain;flex:none;display:block}
.logo b{font-size:19px;letter-spacing:-.3px}
.logo .logo-sub{font-size:11px;font-weight:600;color:#7B8CA0;letter-spacing:.02em}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}

#ana{min-height:100vh;background:var(--bg)}
.ahead{background:var(--ink);color:#fff;padding:14px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.ahead .logo b{color:#fff}
.ahead .sl{font-size:12px;color:#7B8CA0;border-left:1px solid #2C3B4E;padding-left:16px;margin-left:2px}
.lform{margin-left:auto;display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.lform .fg{display:flex;flex-direction:column;gap:3px}
.lform label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#7B8CA0;font-weight:700}
.lform input{width:150px;padding:7px 10px;border:1px solid #2C3B4E;border-radius:8px;background:#16202E;color:#fff;font-size:13px}
.lform input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.25)}
.lform input::placeholder{color:#546276}
.lerr{color:#FF9B9B;font-size:12px;font-weight:600;align-self:center}

.hero{background:linear-gradient(145deg,#0B1220 0%,#121A2E 42%,#1A1840 72%,#0E2A32 100%);color:#fff;padding:38px 26px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,245,.35),transparent 70%);pointer-events:none}
.hero::before{content:"";position:absolute;left:-40px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,197,.22),transparent 68%);pointer-events:none}
.hero h1,.hero p,.hkpis{position:relative;z-index:1}
.hero h1{font-size:27px;font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.hero p{color:#9FB0C2;max-width:640px;font-size:14px}
.hkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
.hk{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:14px 16px}
.hk .n{font-family:"JetBrains Mono",monospace;font-size:25px;font-weight:700;letter-spacing:-1px}
.hk .l{font-size:11px;color:#8FA1B4;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:2px}
.hk.g .n{color:var(--accent)} .hk.r .n{color:#FF8A8A} .hk.y .n{color:#F5C563}
.awrap{padding:24px 26px;max-width:1220px;margin:0 auto}

.bar{height:7px;border-radius:4px;background:#EAEEF3;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fstep{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:#fff;position:relative}
.fstep .k{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:var(--brand);letter-spacing:1px}
.fstep b{display:block;font-size:13.5px;margin:3px 0 4px}
.fstep p{font-size:12px;color:var(--mut);line-height:1.5}
.fstep .who{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}

/* ---------- SHELL ---------- */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
aside{width:232px;flex:none;background:var(--ink);color:#AFBCCB;padding:16px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .logo{padding:6px 8px 16px;color:#fff}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;width:100%;text-align:left;color:#AFBCCB;transition:.12s}
.nav:hover{background:#1A2438;color:#fff}
.nav.on{background:linear-gradient(90deg,var(--brand),var(--violet));color:#fff}
.nav .ic{width:17px;text-align:center;font-size:14px}
.nav .cnt{margin-left:auto;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700}
.nav.on .cnt{background:rgba(0,0,0,.22)}
.nav .cnt.hot{background:var(--dang);color:#fff}
.navgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:#5C6E82;padding:14px 11px 5px;font-weight:700}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;font-weight:600;letter-spacing:-.2px}
header .who{margin-left:auto;display:flex;align-items:center;gap:10px}
.bell{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--dang);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.wrap{padding:22px;flex:1}

/* ---------- BLOCKS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:13.5px;font-weight:600}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .n{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:700;letter-spacing:-1px}
.kpi .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:2px}
.kpi.hot .n{color:var(--dang)} .kpi.ok .n{color:var(--accent)} .kpi.w .n{color:var(--warn)}

.btn{padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#F0F3F7}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:var(--brand-d)}
.btn.d{background:#fff;color:var(--dang);border-color:#F1C9C9}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:#FAFBFC;position:sticky;top:0;z-index:2;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #F0F3F7;vertical-align:middle}
tr:hover td{background:#FAFCFD}
.tscroll{max-height:calc(100vh - 300px);overflow:auto;border-radius:0 0 var(--r) var(--r)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip .b{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;background:#EEF2F6;color:#54657A}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px}
.mut{color:var(--mut)}
.sml{font-size:12px}
.empty{padding:44px 20px;text-align:center;color:var(--mut)}
.empty .e{font-size:30px;margin-bottom:8px;opacity:.5}

/* ---------- MODAL ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,35,.5);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:60;overflow-y:auto}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.modal.lg{max-width:900px}
.modal.xl{max-width:1100px}
.klinik-link{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:700;border-bottom:1px solid transparent}
.klinik-link:hover{border-bottom-color:var(--brand)}
.slot.appt{cursor:pointer;text-align:left;padding:8px 10px}
.slot.appt .s{line-height:1.25}
.slot.appt .who{font-size:9px;font-weight:600;color:var(--mut);margin-top:3px}
.mini.appt-mini{cursor:pointer}
.mini.appt-mini:hover{filter:brightness(.95)}
.kk-wrap{display:grid;grid-template-columns:200px 1fr;gap:0;min-height:420px}
.kk-side{border-right:1px solid var(--line);background:#FAFBFC;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.kk-nav{text-align:left;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mut);border:0;background:transparent;width:100%}
.kk-nav:hover{background:#EEF2F7;color:var(--ink)}
.kk-nav.on{background:var(--brand-soft);color:var(--brand-d)}
.kk-nav:disabled{opacity:.45;cursor:not-allowed}
.kk-main{padding:16px 18px;display:grid;gap:14px;max-height:68vh;overflow-y:auto}
.kk-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.kk-ico{width:48px;height:48px;border-radius:12px;background:var(--brand-soft);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.kk-meta{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:6px}
.kk-meta span{font-size:12px;color:var(--mut)}
.kk-meta b{color:var(--ink);font-weight:600}
.kk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){
  .kk-wrap{grid-template-columns:1fr}
  .kk-side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}
  .kk-grid{grid-template-columns:1fr}
}
.kk-panel{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kk-panel h4{margin:0;padding:10px 12px;background:#F5F7FB;font-size:12px;font-weight:700;color:var(--brand-d);border-bottom:1px solid var(--line)}
.kk-panel .body{padding:10px 12px}
.kk-panel table{width:100%}
.kk-panel td{padding:6px 0;vertical-align:top;font-size:13px}
.kk-panel td.lbl{width:38%;color:var(--mut);font-size:12px}
.kk-empty{background:#FFF8E8;border:1px solid #F0E0B8;border-radius:10px;padding:14px 16px;color:#8A6A20;font-size:13px}
.kk-sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.kk-sec-h h3{font-size:15px;font-weight:700;margin:0}
.kk-person{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.kk-person .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.kk-drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--mut);background:#FAFBFC}
.kk-act{display:grid;gap:0}
.kk-act .it{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.kk-act .it:last-child{border-bottom:0}
.kk-act .ic{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:13px}
.kk-pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kk-pay .box{border-radius:10px;padding:14px;border:1px solid var(--line)}
.kk-pay .box .n{font-size:20px;font-weight:700;font-family:"JetBrains Mono",monospace}
.kk-pay .box .l{font-size:11px;color:var(--mut);font-weight:600;margin-top:2px}
.mini.appt-mini{background:#1A9C6B;color:#fff;border-radius:4px;padding:3px 6px;font-size:10px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini.appt-mini.plan{background:#1A9C6B}
.mini.appt-mini.done{background:#E08A2E}
.day{min-height:96px}
.slot.appt{background:#E8F7F0;border-color:#1A9C6B}
.slot.appt .s{color:#0F6B4A}
.slot.appt .who{color:#5A6A7A}
.m-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.m-h h3{font-size:15px;font-weight:600}
.m-h .x{margin-left:auto;font-size:20px;color:var(--mut);width:28px;height:28px;border-radius:6px}
.m-h .x:hover{background:#F0F3F7}
.m-b{padding:20px;display:grid;gap:14px;max-height:70vh;overflow-y:auto}
.m-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FAFBFC;border-radius:0 0 14px 14px}

/* ---------- TAKVİM ---------- */
.calnav{display:flex;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;padding:6px 0}
.day{border:1px solid var(--line);border-radius:8px;min-height:82px;padding:6px;background:#fff;text-align:left;transition:.12s;display:flex;flex-direction:column;gap:3px}
.day:hover{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
.day.pad{background:#FAFBFC;border-style:dashed;cursor:default;opacity:.5}
.day.pad:hover{border-color:var(--line);box-shadow:none}
.day.wknd{background:#F7F8FC}
.day.today{border-color:var(--brand);border-width:2px}
.day .dn{font-size:12px;font-weight:700;font-family:"JetBrains Mono",monospace}
.day .free{font-size:10px;font-weight:700;color:var(--brand)}
.day .full{font-size:10px;font-weight:700;color:var(--dang)}
.mini{font-size:10px;padding:2px 4px;border-radius:4px;background:var(--brand-soft);color:var(--brand-d);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini.busy{background:#F2F4F7;color:#6B7A8D}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;transition:.12s;background:#fff}
.slot .t{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px}
.slot .s{font-size:10px;font-weight:600;margin-top:2px;color:var(--brand)}
.slot:hover{border-color:var(--brand)}
.slot.busy{background:#F2F4F7;color:var(--mut)}
.slot.busy .s{color:var(--mut)}
.slot.appt{background:var(--accent-soft);border-color:var(--accent)}
.slot.appt .s{color:#0F8F85}
.slot.mine{border-color:var(--ink);background:#EEF1F5}
.slot.past{opacity:.4}

.pill{padding:5px 10px;border-radius:20px;border:1px solid var(--line);font-size:12px;font-weight:600;background:#fff}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

.segpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.segbtn{border:1px solid var(--line);border-radius:8px;padding:9px 11px;text-align:left;transition:.12s;background:#fff}
.segbtn:hover{border-color:var(--ink);background:#FAFBFC}
.segbtn.on{border-color:var(--ink);border-width:2px;background:#F5F7FA}
.segbtn .nm{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.segbtn .gn{font-size:11px;color:var(--mut);margin-top:2px}
.dotc{width:9px;height:9px;border-radius:50%;flex:none}

.note{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-bottom:10px}
.note .mt{font-size:11.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note .tx{margin-top:3px;white-space:pre-wrap}

.guide h2{font-size:15px;font-weight:700;margin:0 0 4px}
.guide h4{font-size:12.5px;font-weight:700;color:var(--brand-d);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.5px}
.guide p{margin-bottom:8px}
.quote{background:var(--brand-soft);border-left:3px solid var(--brand);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:9px;font-size:13.5px}
.warnbox{background:#FEF6E7;border-left:3px solid var(--warn);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:9px;font-size:13px}
.dangbox{background:#FDEEEE;border-left:3px solid var(--dang);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:9px;font-size:13px}
.step{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #F0F3F7}
.step .num{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;font-family:"JetBrains Mono",monospace}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:200;transform:translateY(80px);opacity:0;transition:.24s}
.toast.on{transform:none;opacity:1}
.sync{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.sync .d{width:7px;height:7px;border-radius:50%;background:var(--brand)}
@media(max-width:980px){.cols{grid-template-columns:1fr}aside{width:62px;padding:12px 8px}aside .logo b,aside .logo .logo-sub,aside .nav span.lb,aside .navgrp{display:none}.nav{justify-content:center}.nav .cnt{display:none}.wrap{padding:14px}}
</style>
</head>
<body>

<!-- ================= ANA EKRAN (giriş öncesi) ================= -->
<div id="ana">
  <div class="ahead">
    <div class="logo"><img class="mark-img" src="/assets/brand/nefalix-logo.png" alt="Nefalix" width="34" height="34"><div><b>Nefalix</b><div class="logo-sub">Saha CRM</div></div></div>
    <div class="sl">Klinik arama · randevu · görüşme takibi</div>
    <div class="lform">

const Depo = {
  async oku(){
    if(CFG.BACKEND==='server'){
      try{
        const r = await fetch(CFG.API_GET, { credentials:'include', cache:'no-store' });
        if(r.status===401) return null;
        const j = await r.json();
        if(j && j.data && j.data.clinics) return j.data;
        return null;
      }catch(e){ console.warn('Sunucu okunamadı', e); return null; }
    }
    try{ const s = localStorage.getItem('nefalix_crm'); return s? JSON.parse(s):null; }catch(e){ return null; }
  },
  async yaz(st){
    st.rev = (st.rev||0)+1;
    if(CFG.BACKEND==='server'){
      try{
        const r = await fetch(CFG.API_SAVE, {
          method:'POST',
          credentials:'include',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ data: st })
        });
        if(!r.ok) throw new Error('save '+r.status);
        return;
      }catch(e){ console.warn('Sunucuya yazılamadı', e); }
    }
    try{ localStorage.setItem('nefalix_crm', JSON.stringify(st)); }catch(e){}
  }
};

let S = null, ME = null, SAYFA = 'kokpit', kaydetZ = null;

function bugun(){ const d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function tarihTR(s){ if(!s) return '—'; const [y,m,g]=s.split('-'); return `${g}.${m}.${y}`; }
function ekleGun(s,n){ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function farkGun(s){ const a=new Date(bugun()+'T00:00:00'), b=new Date(s+'T00:00:00'); return Math.round((b-a)/86400000); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function usr(id){ return USERS.find(u=>u.id===id) || {ad:'—',renk:'#94A3B8'}; }
function bas(s){ return (s||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function canEditKlinik(){ return !!(ME && (ME.id==='ak' || ME.id==='en')); }
function klinikLink(cid, ad, extraClass){
  const label = esc(ad||'—');
  if(!cid) return `<b class="${extraClass||''}">${label}</b>`;
  return `<a href="#" class="klinik-link ${extraClass||''}" onclick="event.preventDefault();event.stopPropagation();klinikAc('${cid}')">${label}</a>`;
}

}
function ensureExtras(){
  if(!S) return;
  S.offers = S.offers || [];
  S.payments = S.payments || [];
  S.files = S.files || [];
  S.notifs = S.notifs || [];
  (S.clinics||[]).forEach(c=>{
    if(!Array.isArray(c.kisiler)) c.kisiler = [];
    if(!Array.isArray(c.notGecmisi)) c.notGecmisi = [];
    if(c.sozlesme===undefined) c.sozlesme = null;
    if(c.hizliNot===undefined) c.hizliNot = '';
    if(c.yetkili===undefined) c.yetkili = '';
    if(c.unvan===undefined) c.unvan = '';
    if(c.email===undefined) c.email = '';
    if(c.sehir===undefined) c.sehir = 'İstanbul';
    if(c.vergi===undefined) c.vergi = '';
    if(c.kaynak===undefined) c.kaynak = '';
    if(c.hekimSayisi===undefined) c.hekimSayisi = '';
    // yetkili varsa ilgili kişilere bir kez ekle
    if(c.yetkili && !c.kisiler.length){
      c.kisiler.push({id:uid(), ad:c.yetkili, unvan:c.unvan||'', tel:c.tel||'', email:c.email||''});
    }
  });
}

function segmentAta(cid, sk, notMetni, kimId){
  const c = S.clinics.find(x=>x.id===cid); if(!c) return;
  const s = SEG[sk];
  c.segment = sk;
  c.sonArama = bugun();
  c.aramaSayisi = (c.aramaSayisi||0)+1;
  c.hatirlatma = (s.gun===null || s.gun===0) ? null : ekleGun(bugun(), s.gun);
  if(sk==='randevu') c.hatirlatma = null; // randevu takvimden takip edilir
  if(sk==='gun1') c.hatirlatma = bugun(); // gün içinde → Dinamik Arama Bugün
  S.notes.unshift({
    id:uid(), clinicId:cid, userId:(kimId||ME.id), tarih:new Date().toISOString(),
    segment:sk, metin:(notMetni||'').trim()
  });
  kaydet();
}

function takipListesi(uid_){
  // Hatırlatma günü gelmiş/geçmiş + atanmış henüz aranmamış (aranmadi)
  const out = [];
  S.clinics.forEach(c=>{
    const own = !uid_ || sahibi(c)===uid_;
    if(!own) return;
    if(c.hatirlatma){
      out.push({c, fark:farkGun(c.hatirlatma)});
      return;
    }
    // Liste atandı, henüz aranmadı → sabah Dinamik'te görünsün
    if((c.segment||'aranmadi')==='aranmadi' && sorumluId(c) && (!uid_ || sorumluId(c)===uid_)){
      out.push({c, fark:0});
    }
  });
  return out.filter(x=>x.fark<=7).sort((a,b)=>a.fark-b.fark);
}
function listeAta(sorumluAd){
  const sec = [...document.querySelectorAll('.havuz-chk:checked')].map(x=>x.value);
  if(!sec.length){ toast('Önce klinik seç.'); return; }
  if(!sorumluAd){ toast('Temsilci seç.'); return; }
  let n=0;
  sec.forEach(id=>{
    const c=S.clinics.find(x=>x.id===id); if(!c) return;
    c.sorumlu = sorumluAd;
    if((c.segment||'aranmadi')==='aranmadi') c.hatirlatma = bugun();
    n++;
  });
  kaydet(); toast(n+' klinik → '+sorumluAd); ciz();
}
// Takibin sahibi = kliniği en son arayan/not giren kişi. Hiç aranmadıysa Excel'deki sorumlu.
function sahibi(c){
  const n = S.notes.find(x=>x.clinicId===c.id);
  return n ? n.userId : sorumluId(c);
}
function sahipAd(c){ const i=sahibi(c); return i? usr(i).ad.split(' ')[0] : (c.sorumlu||'—'); }
function sorumluId(c){
  const n=(c.sorumlu||'').toLowerCase();
  if(n.includes('abd')) return 'ak';
  if(n.includes('enes')) return 'en';
  if(n.includes('kader')) return 'kd';
  return '';
}
function yakaOf(c){
  if(c.yaka) return c.yaka;
  const blob=((c.semt||'')+' '+(c.bolge||'')+' '+(c.adres||'')+' '+(c.ad||'')).toLowerCase()
    .replace(/ı/g,'i').replace(/İ/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
  const anadolu=['kadikoy','atasehir','uskudar','maltepe','kartal','pendik','umraniye','tuzla','sultanbeyli','cekmekoy','sancaktepe','beykoz','sile','anadolu','moda','bostanci','kozyatagi'];
  if(anadolu.some(x=>blob.includes(x))) return 'Anadolu Yakası';
  return 'Avrupa Yakası';
}
const YAKA_OPTS = ['Avrupa Yakası','Anadolu Yakası'];
const SAHA_LAST_ROUTE = 'nefalix_saha_last_page';
const ILCE_KNOWN = [
  'Adalar','Arnavutköy','Ataşehir','Avcılar','Bahçelievler','Bakırköy','Başakşehir','Bayrampaşa',
  'Beşiktaş','Beykoz','Beylikdüzü','Beyoğlu','Büyükçekmece','Çekmeköy','Esenler','Esenyurt',
  'Eyüpsultan','Eyüp','Fatih','Gaziosmanpaşa','Güngören','Kadıköy','Kağıthane','Kartal',
  'Küçükçekmece','Maltepe','Pendik','Sancaktepe','Sarıyer','Silivri','Şile','Şişli',
  'Sultanbeyli','Sultangazi','Tuzla','Ümraniye','Üsküdar','Zeytinburnu'
];
function foldTr(s){
  return String(s||'').toLowerCase()
    .replace(/ı/g,'i').replace(/İ/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
}
/** Tek ilçe adı — semt/mahalle birleştirilmez (Kadıköy tek). */
function ilceOf(c){
  if(c.ilce) return c.ilce;
  const blob = foldTr([c.semt,c.bolge,c.adres,c.ad].join(' '));
  const hit = [...ILCE_KNOWN].sort((a,b)=>b.length-a.length).find(n=>blob.includes(foldTr(n)));
  if(hit) return hit;
  const raw = String(c.semt||c.bolge||'').trim();
  if(!raw) return '—';
  const slash = raw.match(/\/\s*([^/]+)\s*$/);
  if(slash){
    const cand = slash[1].replace(/\s*\([^)]*\)\s*/g,'').trim();
    const m = ILCE_KNOWN.find(n=>foldTr(n)===foldTr(cand));
    if(m) return m;
    if(cand.length>2 && !/^(avrupa|anadolu|istanbul)/i.test(cand)) return cand;
  }
  const paren = raw.replace(/\s*\([^)]*\)\s*/g,'').split('/')[0].trim();
  const m2 = ILCE_KNOWN.find(n=>foldTr(n)===foldTr(paren));
  if(m2) return m2;
  if(paren.length>2 && !/^(avrupa|anadolu|istanbul)/i.test(paren)) return paren;
  return '—';
}
function ilceListesi(){
  const m = new Map();
  S.clinics.forEach(c=>{
    const i = ilceOf(c);
    if(!i || i==='—') return;
    m.set(i, (m.get(i)||0)+1);
  });
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'tr'));
}
function kayitliSayfa(){
  const hash = (location.hash || '').replace(/^#/, '').trim();
  if(hash && SAYFALAR[hash]) return hash;
  try{
    const s = localStorage.getItem(SAHA_LAST_ROUTE);
    if(s && SAYFALAR[s]) return s;
  }catch(e){}
  return null;
}
function baslangicSayfasi(userId){

}
function gecikmisSayi(uid_){ return takipListesi(uid_).filter(x=>x.fark<=0).length; }

function slotDurum(tarih, saat){
  const mesgul = S.busy.filter(b=>b.tarih===tarih && b.saat===saat).map(b=>b.userId);
  const rand   = S.appts.find(a=>a.tarih===tarih && a.saat===saat && a.durum!=='iptal');
  const sahaci = USERS.filter(u=>u.saha).map(u=>u.id);
  const musait = sahaci.filter(id=>!mesgul.includes(id));
  return {mesgul, rand, musait, sahaci};
}

function git(p, opts){

  const silent = opts && opts.silent;
  SAYFA = p;
  document.querySelectorAll('.nav[data-p]').forEach(b=>b.classList.toggle('on', b.dataset.p===p));
  document.getElementById('ttl').textContent = SAYFALAR[p].t;
  document.getElementById('page').innerHTML = SAYFALAR[p].f();
  rozetler();
  window.scrollTo(0,0);
  try{ localStorage.setItem(SAHA_LAST_ROUTE, p); }catch(e){}
  const wantHash = '#'+p;
  if(!silent && location.hash !== wantHash){
    history.replaceState(null, '', wantHash);
  }
}

function pKokpit(){

  const gec = t.filter(x=>x.fark<0), bgn = t.filter(x=>x.fark===0);
  const arandi = S.clinics.filter(c=>c.segment!=='aranmadi').length;
  const rnd = S.appts.filter(a=>a.durum!=='iptal' && a.tarih>=bugun());
  const benimRnd = rnd.filter(a=>a.katilimcilar.includes(ME.id));
  const sicak = S.clinics.filter(c=>SEG[c.segment]?.kat==='sicak').length;

  const gorevKart = ME.id==='kd'
   ? `<div class="card"><div class="card-h"><h3>Bugünkü işin</h3></div><div class="card-b">
        <div class="step"><div class="num">1</div><div><b>Arama Ekranı</b>'nı aç, listedeki kliniği ara.<br><span class="mut sml">Ne söyleyeceğini bilmiyorsan Saha Rehberi'nde hazır cümleler var.</span></div></div>
        <div class="step"><div class="num">2</div><div>Görüşme bitince <b>sonucu bir sekmeye</b> at (Ulaşılamadı / Düşünecek / Randevu…).<br><span class="mut sml">Sistem geri dönüş tarihini kendisi hesaplar.</span></div></div>
        <div class="step"><div class="num">3</div><div>İlgilenen klinik olursa <b>Takvim</b>'den boş saati seç, randevuyu yaz.<br><span class="mut sml">Abdülkadir Bey ve Enes Bey'e bildirim gider.</span></div></div>
        <div class="step" style="border:0"><div class="num">4</div><div>Ertesi gün <b>Dinamik Arama</b>'yı aç: günü gelenler orada listelenir.</div></div>
        <div style="margin-top:12px"><button class="btn p" onclick="git('arama')">☏ Aramaya başla</button></div>
      </div></div>`
   : `<div class="card"><div class="card-h"><h3>Yaklaşan görüşmelerin</h3><div class="r"><button class="btn sm" onclick="git('takvim')">Takvimi aç</button></div></div>
      ${benimRnd.length? `<div class="tscroll" style="max-height:none"><table><thead><tr><th>Tarih</th><th>Saat</th><th>Klinik</th><th>Bölge</th><th></th></tr></thead><tbody>
        ${benimRnd.sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat)).slice(0,8).map(a=>{const c=S.clinics.find(x=>x.id===a.clinicId)||{};
        return `<tr><td class="mono">${tarihTR(a.tarih)}</td><td class="mono"><b>${a.saat}</b></td><td>${klinikLink(a.clinicId, c.ad||a.baslik||'—')}</td><td class="sml mut">${esc(c.semt||'')}</td>
        <td><button class="btn sm" onclick="klinikAc('${a.clinicId}')">Kart</button></td></tr>`}).join('')}
      </tbody></table></div>`
      : `<div class="empty"><div class="e">▦</div>Planlanmış görüşmen yok.<br><span class="sml">Kader Hanım randevu oluşturduğunda burada görünecek.</span></div>`}
      </div>`;

  return `
  <div class="grid kpis" style="margin-bottom:14px">
    <div class="kpi ${gec.length?'hot':''}"><div class="n">${gec.length}</div><div class="l">Gecikmiş takip</div></div>
    <div class="kpi w"><div class="n">${bgn.length}</div><div class="l">Bugün dönülecek</div></div>
    <div class="kpi ok"><div class="n">${rnd.length}</div><div class="l">Planlı randevu</div></div>
    <div class="kpi"><div class="n">${arandi}<span style="font-size:15px;color:var(--mut)">/${S.clinics.length}</span></div><div class="l">Aranan klinik</div></div>
    <div class="kpi ok"><div class="n">${sicak}</div><div class="l">Sıcak fırsat</div></div>
  </div>
  <div class="cols">
    ${gorevKart}
    <div class="card"><div class="card-h"><h3>Günü gelen / gecikmiş</h3><div class="r"><button class="btn sm" onclick="git('dinamik')">Tümü</button></div></div>
      ${t.filter(x=>x.fark<=0).length ? `<div class="tscroll" style="max-height:none"><table><tbody>
        ${t.filter(x=>x.fark<=0).slice(0,9).map(({c,fark})=>`<tr>
          <td>${klinikLink(c.id, c.ad)}<div class="sml mut">${esc(c.semt||'')} · ${esc(c.brans||'')}</div></td>
          <td>${segChip(c.segment)}</td>
          <td class="sml ${fark<0?'':'mut'}" style="${fark<0?'color:var(--dang);font-weight:700':''}">${fark<0?Math.abs(fark)+' gün gecikti':'Bugün'}</td>
          <td><button class="btn sm p" onclick="aramaKaydiAc('${c.id}')">Sonuç gir</button></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty"><div class="e">✓</div>Bekleyen takip yok. Temiz liste.</div>`}
    </div>
  </div>`;
}

/* ============ SAYFA: DİNAMİK ARAMA ============ */
let dinFilt = 'benim';
function pDinamik(){
  const hepsi = takipListesi(dinFilt==='benim'?ME.id:null);
  const grup = {
    gecikmis: hepsi.filter(x=>x.fark<0),
    bugun:    hepsi.filter(x=>x.fark===0),
    yarin:    hepsi.filter(x=>x.fark===1),
    hafta:    hepsi.filter(x=>x.fark>1 && x.fark<=7)
  };
  const blok = (bas_,arr,renk)=> !arr.length ? '' : `
    <div class="card" style="margin-bottom:14px">
      <div class="card-h"><span class="chip" style="background:${renk}1A;color:${renk}"><span class="b"></span>${bas_}</span>
        <div class="r"><span class="mut sml">${arr.length} klinik</span></div></div>
      <div class="tscroll" style="max-height:none"><table><thead><tr>
        <th>Klinik</th><th>Branş</th><th>Telefon</th><th>Mevcut sekme</th><th>Dönüş tarihi</th><th>Takip sahibi</th><th></th></tr></thead><tbody>
      ${arr.map(({c,fark})=>`<tr>
        <td>${klinikLink(c.id, c.ad)}<div class="sml mut">${esc(c.semt||'')}</div></td>
        <td class="sml">${esc(c.brans||'')}</td>
        <td class="mono sml">${esc(c.tel||'—')}</td>
        <td>${segChip(c.segment)}</td>
        <td class="sml mono">${tarihTR(c.hatirlatma)} ${fark<0?`<span style="color:var(--dang);font-weight:700">(${Math.abs(fark)}g)</span>`:''}</td>
        <td class="sml">${esc(sahipAd(c))}</td>
        <td style="white-space:nowrap">
          <button class="btn sm" onclick="klinikAc('${c.id}')">Kart</button>
          <button class="btn sm p" onclick="aramaKaydiAc('${c.id}')">Sonuç gir</button>
        </td></tr>`).join('')}
      </tbody></table></div>

  return `
  <div class="row" style="margin-bottom:14px;align-items:center">

      <button class="pill ${dinFilt==='hepsi'?'on':''}" onclick="dinFilt='hepsi';ciz()">Tüm ekip</button>
    </div>
    <div class="mut sml" style="flex:1;align-self:center">Bir klinik en son kimin tarafından arandıysa takip ona düşer. Sonuç girildiğinde otomatik olarak yeni sahibine geçer.</div>
  </div>
  ${blok('Gecikmiş', grup.gecikmis, '#D64545')}
  ${blok('Bugün dönülecek', grup.bugun, '#E8A317')}
  ${blok('Yarın', grup.yarin, '#3B76D9')}
  ${blok('Bu hafta', grup.hafta, '#7C5CD6')}
  ${!hepsi.length? `<div class="card"><div class="empty"><div class="e">✓</div>Bekleyen dönüş yok.<br><span class="sml">Bir klinik bir sekmeye atandığında, sekmenin gün süresi kadar sonra burada belirir.</span></div></div>`:''}
  `;
}

/* ============ SAYFA: ARAMA EKRANI ============ */
let arFilt = {q:'', brans:'', sorumlu:'', seg:'aranmadi', yaka:'', ilce:''};
function pArama(){
  let liste = S.clinics.filter(c=>{
    if(arFilt.seg && c.segment!==arFilt.seg) return false;
    if(arFilt.brans && c.brans!==arFilt.brans) return false;
    if(arFilt.sorumlu && (c.sorumlu||'')!==arFilt.sorumlu) return false;
    if(arFilt.yaka && yakaOf(c)!==arFilt.yaka) return false;
    if(arFilt.ilce && ilceOf(c)!==arFilt.ilce) return false;
    if(arFilt.q){ const q=arFilt.q.toLowerCase(); if(!((c.ad||'')+(c.semt||'')+(c.tel||'')+ilceOf(c)).toLowerCase().includes(q)) return false; }
    return true;
  }).sort((a,b)=>(b.skor||0)-(a.skor||0));

  const branslar = [...new Set(S.clinics.map(c=>c.brans).filter(Boolean))];
  const sorumlular = [...new Set(S.clinics.map(c=>c.sorumlu).filter(Boolean))];
  const hedef = liste[0];

  return `
  <div class="card" style="margin-bottom:14px"><div class="card-b">
    <div class="row">
      <div style="flex:2"><label class="f">Ara</label><input type="text" value="${esc(arFilt.q)}" oninput="arFilt.q=this.value;ciz()" placeholder="Klinik adı, ilçe, telefon…"></div>
      <div><label class="f">Sekme</label><select onchange="arFilt.seg=this.value;ciz()">
        <option value="">Hepsi</option>
        ${SEGMENTS.map(s=>`<option value="${s.k}" ${arFilt.seg===s.k?'selected':''}>${s.ad}</option>`).join('')}
      </select></div>
      <div><label class="f">Yaka</label><select onchange="arFilt.yaka=this.value;ciz()">
        <option value="">Hepsi</option>${YAKA_OPTS.map(y=>`<option value="${y}" ${arFilt.yaka===y?'selected':''}>${y}</option>`).join('')}</select></div>
      <div><label class="f">İlçe</label><select onchange="arFilt.ilce=this.value;ciz()">
        <option value="">Hepsi</option>${ilceListesi().map(([i,n])=>`<option value="${esc(i)}" ${arFilt.ilce===i?'selected':''}>${esc(i)} (${n})</option>`).join('')}</select></div>
      <div><label class="f">Branş</label><select onchange="arFilt.brans=this.value;ciz()">
        <option value="">Hepsi</option>${branslar.map(b=>`<option ${arFilt.brans===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
      <div><label class="f">Sorumlu</label><select onchange="arFilt.sorumlu=this.value;ciz()">
        <option value="">Hepsi</option>${sorumlular.map(b=>`<option ${arFilt.sorumlu===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
    </div>
  </div></div>

  ${hedef? `<div class="cols">
    <div class="card">
      <div class="card-h"><h3>Sıradaki klinik</h3><div class="r"><span class="mut sml">${liste.length} klinik bekliyor</span></div></div>
      <div class="card-b">
        <div style="font-size:19px;font-weight:700;letter-spacing:-.3px">${klinikLink(hedef.id, hedef.ad)}</div>
        <div style="margin:5px 0 12px"><span class="tag">${esc(hedef.brans||'')}</span> <span class="tag">${esc(hedef.semt||'')}</span> <span class="stars">${'★'.repeat(Math.round(hedef.skor||0))}${'☆'.repeat(5-Math.round(hedef.skor||0))}</span></div>
        <table style="margin-bottom:12px">
          <tr><td class="mut sml" style="width:110px">Telefon</td><td class="mono"><b>${esc(hedef.tel||'—')}</b></td></tr>
          <tr><td class="mut sml">Adres</td><td class="sml">${esc(hedef.adres||'—')}</td></tr>
          <tr><td class="mut sml">Web</td><td class="sml">${esc(hedef.web||'—')}</td></tr>
          <tr><td class="mut sml">Ölçek</td><td class="sml">${esc(hedef.olcek||'—')}</td></tr>
          <tr><td class="mut sml">Uluslararası</td><td class="sml">${esc(hedef.uluslararasi||'—')}</td></tr>
          <tr><td class="mut sml">Sorumlu</td><td class="sml">${esc(hedef.sorumlu||'—')}</td></tr>
        </table>
        <div class="row">
          <a class="btn p" style="flex:none" href="tel:${esc((hedef.tel||'').replace(/\s/g,''))}">☏ Ara</a>
          <a class="btn" style="flex:none" target="_blank" href="https://wa.me/${esc((hedef.tel||'').replace(/[^0-9]/g,''))}">WhatsApp</a>
          <a class="btn" style="flex:none" target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent((hedef.ad||'')+' '+(hedef.semt||'')+' İstanbul')}">Haritada aç</a>
          <button class="btn" style="flex:none" onclick="klinikAc('${hedef.id}')">Kartı aç</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Görüşme sonucunu işaretle</h3></div>
      <div class="card-b">
        <div class="mut sml" style="margin-bottom:10px">Bir sekme seç — sistem geri dönüş tarihini otomatik hesaplar ve sorumlusunun <b>Dinamik Arama</b> panelinde o gün listeler.</div>
        <div class="segpick">${SEGMENTS.filter(s=>s.k!=='aranmadi').map(s=>`
          <button class="segbtn" onclick="aramaKaydiAc('${hedef.id}','${s.k}')">
            <div class="nm"><span class="dotc" style="background:${s.renk}"></span>${s.ad}</div>
            <div class="gn">${s.k==='gun1'?'Bugün Dinamik Arama\'da':(s.gun===null?'Dönüş yok':(s.gun===0?'Takvimden takip':'+'+s.gun+' gün sonra döner'))}</div>
          </button>`).join('')}</div>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="card-h"><h3>Bekleyen liste</h3></div>
    <div class="tscroll"><table><thead><tr><th>#</th><th>Klinik</th><th>Branş</th><th>Semt</th><th>Telefon</th><th>Skor</th><th>Sorumlu</th><th></th></tr></thead><tbody>
      ${liste.slice(0,120).map((c,i)=>`<tr>
        <td class="mono mut sml">${i+1}</td>
        <td>${klinikLink(c.id, c.ad)}</td><td class="sml">${esc(c.brans||'')}</td><td class="sml">${esc(c.semt||'')}</td>
        <td class="mono sml">${esc(c.tel||'—')}</td><td class="stars">${'★'.repeat(Math.round(c.skor||0))}</td>
        <td class="sml">${esc(c.sorumlu||'—')}</td>
        <td><button class="btn sm p" onclick="aramaKaydiAc('${c.id}')">Sonuç gir</button></td></tr>`).join('')}
    </tbody></table></div>
  </div>`
  : `<div class="card"><div class="empty"><div class="e">✓</div>Bu filtrede klinik kalmadı.</div></div>`}`;
}

/* ============ SAYFA: TAKVİM ============ */
let calAy = 6, calYil = 2026, calGun = null; // 6 = Temmuz
function pTakvim(){
  const ilk = new Date(calYil, calAy, 1);
  const gunSay = new Date(calYil, calAy+1, 0).getDate();
  let bosluk = (ilk.getDay()+6)%7;
  let hucre = '';
  for(let i=0;i<bosluk;i++) hucre += `<div class="day pad"></div>`;
  for(let g=1; g<=gunSay; g++){
    const t = `${calYil}-${String(calAy+1).padStart(2,'0')}-${String(g).padStart(2,'0')}`;
    const dow = new Date(calYil,calAy,g).getDay();
    const wknd = dow===0||dow===6;
    const rnd = S.appts.filter(a=>a.tarih===t && a.durum!=='iptal');
    let bosSlot=0;
    SAAT.forEach(s=>{ const d=slotDurum(t,s); if(d.musait.length && !d.rand) bosSlot++; });
    const gecmis = t < bugun();
    hucre += `<button class="day ${wknd?'wknd':''} ${t===bugun()?'today':''}" onclick="calGun='${t}';ciz()">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="dn">${g}</span>
        ${gecmis?'':`<span class="${bosSlot?'free':'full'}" style="margin-left:auto">${bosSlot?bosSlot+' boş':'dolu'}</span>`}
      </div>
      ${rnd.slice(0,4).map(a=>{const c=S.clinics.find(x=>x.id===a.clinicId)||{};const kim=(a.katilimcilar||[]).map(i=>usr(i).ad.split(' ')[0]).join(',');
        return `<div class="mini appt-mini ${a.durum==='yapildi'?'done':'plan'}" title="${esc(c.ad||'')} · ${esc(kim)}" onclick="event.stopPropagation();calGun='${t}';randevuAc('${a.id}')">${a.saat} ${esc((c.ad||a.baslik||'').slice(0,18))}</div>`;}).join('')}
      ${rnd.length>4?`<div class="mini busy">+${rnd.length-4} daha</div>`:''}
    </button>`;
  }

  const g = calGun;
  const detay = !g ? `<div class="card"><div class="empty"><div class="e">▦</div>Bir güne tıkla, saatler burada açılsın.</div></div>` : (()=>{
    const d = new Date(g+'T12:00:00');
    return `<div class="card">
      <div class="card-h"><h3>${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()} · ${GUN[(d.getDay()+6)%7]}</h3>
        <div class="r"><span class="mut sml">${ME.saha?'Kendi meşgul saatini işaretlemek için saate tıkla':'Boş saate tıklayıp randevu oluştur'}</span></div></div>
      <div class="card-b">
        <div class="slots">${SAAT.map(s=>{
          const st = slotDurum(g,s);
          const benMesgul = st.mesgul.includes(ME.id);
          if(st.rand){ const c=S.clinics.find(x=>x.id===st.rand.clinicId)||{};
            const kim=(st.rand.katilimcilar||[]).map(i=>usr(i).ad.split(' ')[0]).join(' · ')||'—';
            const tip = (st.rand.notu||c.brans||'Saha görüşmesi').slice(0,28);
            return `<button class="slot appt" onclick="randevuAc('${st.rand.id}')" title="Randevu detayı">
              <div class="t">${s}</div>
              <div class="s">${klinikLink(st.rand.clinicId, (c.ad||'Randevu').slice(0,22))}</div>
              <div class="who">${esc(tip)}</div>
              <div class="who">${esc(kim)} · ${st.rand.durum==='yapildi'?'Yapıldı':'Planlandı'}</div>
            </button>`; }
          if(!st.musait.length) return `<button class="slot busy"><div class="t">${s}</div><div class="s">Kimse müsait değil</div></button>`;
          const cls = ME.saha ? (benMesgul?'busy mine':'') : '';
          const act = ME.saha ? `mesgulTogg('${g}','${s}')` : `randevuYeni('${g}','${s}')`;
          return `<button class="slot ${cls}" onclick="${act}">
            <div class="t">${s}</div>
            <div class="s">${ME.saha ? (benMesgul?'Meşgulsün':'Müsaitsin') : st.musait.map(i=>usr(i).ad.split(' ')[0]).join(' · ')}</div>
          </button>`;
        }).join('')}</div>
        ${ME.saha? `<div class="mut sml" style="margin-top:12px">Randevu olan saatler yeşil blokta klinik adıyla görünür — tıklayınca detay açılır; klinik adına tıklayınca klinik kartı açılır. Meşgul işaretlediğin saatler Kader Hanım'a <b>müsait değil</b> olarak görünür.</div>`
                 : `<div class="mut sml" style="margin-top:12px">Yeşil saatlerde yazan isimler o saatte müsait olan kişilerdir. Tıkla, randevu oluştur; ilgili kişilere bildirim düşer. Mevcut randevular yeşil blokta otomatik görünür.</div>`}
      </div></div>`;
  })();

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-h">
      <div class="calnav">
        <button class="btn sm" onclick="ayGit(-1)">‹</button>
        <h3 style="min-width:150px;text-align:center">${AY[calAy]} ${calYil}</h3>
        <button class="btn sm" onclick="ayGit(1)">›</button>
      </div>
      <div class="r">
        <span class="chip" style="background:var(--brand-soft);color:var(--brand-d)"><span class="b"></span>Randevu</span>
        <span class="chip" style="background:#F2F4F7;color:#6B7A8D"><span class="b"></span>Meşgul</span>
        <button class="btn sm" onclick="calGun=bugun();calAy=new Date().getMonth();calYil=new Date().getFullYear();ciz()">Bugün</button>
      </div>
    </div>
    <div class="card-b">
      <div class="cal" style="margin-bottom:5px">${GUN.map(x=>`<div class="dh">${x}</div>`).join('')}</div>
      <div class="cal">${hucre}</div>
    </div>
  </div>
  ${detay}`;
}
function ayGit(n){ calAy+=n; if(calAy>11){calAy=0;calYil++;} if(calAy<0){calAy=11;calYil--;} calGun=null; ciz(); }
function mesgulTogg(t,s){
  const i = S.busy.findIndex(b=>b.tarih===t && b.saat===s && b.userId===ME.id);
  if(i>=0) S.busy.splice(i,1); else S.busy.push({id:uid(),tarih:t,saat:s,userId:ME.id});
  kaydet(); ciz();
}

/* ============ SAYFA: RANDEVULAR ============ */
function pRandevu(){
  const list = S.appts.filter(a=>a.durum!=='iptal').sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));
  const gelecek = list.filter(a=>a.tarih>=bugun()), gecmis = list.filter(a=>a.tarih<bugun());
  const tablo = (arr,gec)=> !arr.length? `<div class="empty"><div class="e">▦</div>Kayıt yok.</div>` : `
    <div class="tscroll" style="max-height:none"><table><thead><tr><th>Tarih</th><th>Saat</th><th>Klinik</th><th>Adres</th><th>Katılımcı</th><th>Durum</th><th></th></tr></thead><tbody>
    ${arr.map(a=>{const c=S.clinics.find(x=>x.id===a.clinicId)||{};return `<tr>
      <td class="mono sml"><b>${tarihTR(a.tarih)}</b></td><td class="mono"><b>${a.saat}</b></td>
      <td>${klinikLink(a.clinicId, c.ad||a.baslik||'—')}<div class="sml mut">${esc(c.brans||'')}</div></td>
      <td class="sml mut">${esc((c.adres||'').slice(0,42))}</td>

/* ============ SAYFA: WHATSAPP (Evolution) ============ */
let _waState = { loading:false, connected:false, state:'', qr:null, instance:'', hint:'', err:'' };
async function waApi(action){
  _waState.loading=true; _waState.err=''; ciz();
  try{
    const r = await fetch(CFG.API_WA, {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action })
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    _waState.connected = !!j.connected;
    _waState.state = j.state||'';
    _waState.qr = j.qr||null;
    _waState.instance = j.instance||'';
    _waState.hint = j.hint||'';
  }catch(e){
    _waState.err = e.message||String(e);
  }
  _waState.loading=false; ciz();
}
function pWhatsapp(){
  const st=_waState;
  return `
  <div class="grid2">
    <div class="card">
      <div class="card-h"><h3>Kader Hanım — Evolution bağlantısı</h3>
        <div class="r"><span class="chip" style="background:${st.connected?'#22D3C51A':'#E8A3171A'};color:${st.connected?'#0F766E':'#B45309'}">${st.connected?'Bağlı':'Bekliyor'}</span></div>
      </div>
      <div class="card-b">
        <p class="sml mut" style="margin-bottom:12px">Verdiğimiz WhatsApp numarasıyla Evolution instance’ına bağlanın. QR’ı telefonda <b>WhatsApp → Bağlı cihazlar → Cihaz bağla</b> ile okutun.</p>
        <table style="margin-bottom:12px">
          <tr><td class="mut sml" style="width:120px">Instance</td><td class="mono sml">${esc(st.instance||'—')}</td></tr>
          <tr><td class="mut sml">Durum</td><td class="sml">${esc(st.state||'henüz sorgulanmadı')}</td></tr>
        </table>
        ${st.err?`<div class="warnbox">${esc(st.err)}</div>`:''}
        ${st.hint?`<div class="sml mut" style="margin-bottom:10px">${esc(st.hint)}</div>`:''}
        <div class="row">
          <button class="btn p" style="flex:none" ${st.loading?'disabled':''} onclick="waApi('start')">${st.loading?'…':'QR başlat'}</button>
          <button class="btn" style="flex:none" ${st.loading?'disabled':''} onclick="waApi('refresh')">Yenile / sıfırla</button>

        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>QR kod</h3></div>
      <div class="card-b" style="text-align:center;min-height:220px;display:flex;align-items:center;justify-content:center">
        ${st.qr?`<img src="${st.qr}" alt="QR" style="max-width:260px;width:100%;border-radius:12px;border:1px solid var(--line)">`
          :`<div class="empty" style="border:0;padding:24px"><div class="e">✆</div>${st.connected?'Bağlı — QR gerekmez.':'QR için “QR başlat”a basın.'}</div>`}
      </div>

  <div class="card" style="margin-top:14px">
    <div class="card-h"><h3>Gelen mesajlar</h3></div>
    <div class="card-b sml mut">Bağlantı sonrası mesajlar Evolution webhook → Inbox hattına düşer. Bu ekranda şimdilik bağlantı + durum yönetimi var; tam konuşma listesi bir sonraki fazda eklenecek.</div>

        </button>`).join('')}</div>
    </div>

      <textarea id="nt" rows="4" placeholder="Kiminle görüşüldü, ne dedi, bir sonraki adım ne?"></textarea></div>

function segSec(k){ _segSec=k; document.querySelectorAll('#sp .segbtn').forEach(b=>b.classList.toggle('on', b.dataset.k===k)); segOnizle(); }
function segOnizle(){
  const e=document.getElementById('sonuc'); if(!e) return;
  if(!_segSec){ e.innerHTML='Bir sekme seç.'; return; }
  const s=SEG[_segSec];
  e.innerHTML = s.gun===null ? '↳ Bu sekmede otomatik dönüş kurulmaz; klinik listeden düşer.'
    : s.gun===0 ? '↳ Randevu takvimden takip edilecek.'
    : s.k==='gun1' ? '↳ Dönüş: <b>bugün</b> — hemen <b>Dinamik Arama → Bugün</b> listesinde görünür.'
    : `↳ Dönüş tarihi: <b class="mono">${tarihTR(ekleGun(bugun(), s.gun))}</b> — o gün <b>Dinamik Arama</b> panelinde listelenir.`;
}
function aramaKaydet(cid){
  if(!_segSec){ toast('Önce bir sekme seç.'); return; }
  const nt = document.getElementById('nt').value;
  segmentAta(cid, _segSec, nt);
  const c = S.clinics.find(x=>x.id===cid);
  if(_segSec==='randevu'){
    mKapat();
    toast('Randevu sekmesi atandı — takvimden saati seç.');
    calGun = bugun(); git('takvim');
    return;
  }
  toast('Kaydedildi: '+SEG[_segSec].ad);
  ciz();
  klinikAc(cid, 'gorusme');
}

/* --- Not düzenle --- */
function notDuzenleAc(nid, afterSave){
  const n = S.notes.find(x=>x.id===nid); if(!n) return;
  const c = S.clinics.find(x=>x.id===n.clinicId)||{};
  const d = new Date(n.tarih);
  const tarihStr = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  mAc(`<div class="m-h"><h3>${afterSave?'Kayıt tamam — notu düzenle':'Notu düzenle'}</h3><button class="x" onclick="mKapat()">×</button></div>
  <div class="m-b">
    <div class="sml mut">${klinikLink(n.clinicId, c.ad||'Klinik')} · ${segChip(n.segment)} · ${esc(tarihStr)} · ${esc(usr(n.userId).ad)}</div>
    <div><label class="f">Görüşme notu</label>
      <textarea id="nd_metin" rows="5" placeholder="Not metni…">${esc(n.metin||'')}</textarea></div>
    ${afterSave?`<div class="sml mut">İstersen notu şimdi düzelt; gerekmezse Kapat ile çık.</div>`:''}
  </div>
  <div class="m-f">
    <button class="btn" onclick="mKapat()">Kapat</button>
    <button class="btn p" onclick="notDuzenleKaydet('${nid}')">Notu kaydet</button>
  </div>`);
}
function notDuzenleKaydet(nid, stay){
  const n = S.notes.find(x=>x.id===nid); if(!n) return;
  const el = document.getElementById('note_edit_'+nid) || document.getElementById('nd_metin');
  n.metin = (el?.value||'').trim();
  n.duzenlendi = new Date().toISOString();
  n.duzenleyen = ME.id;
  kaydet(); toast('Not güncellendi.');
  if(stay && n.clinicId){ klinikAc(n.clinicId, window._kkTab||'gorusme'); ciz(); return; }
  mKapat(); ciz();
}
function notBlokHtml(n){
  const d=new Date(n.tarih); const s=SEG[n.segment]||SEG.aranmadi;
  const tarih = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `<div class="note" style="border-color:${s.renk}">
    <div class="mt">${segChip(n.segment)} <span>${tarih}</span> <span>· ${esc(usr(n.userId).ad)}</span>
      ${n.duzenlendi?`<span class="mut">(düzenlendi)</span>`:''}</div>
    <textarea id="note_edit_${n.id}" rows="3" style="width:100%;margin-top:6px" placeholder="Not metni…">${esc(n.metin||'')}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:6px;gap:8px">
      <button class="btn sm p" onclick="notDuzenleKaydet('${n.id}', true)">Kaydet</button>
    </div>
  </div>`;
}

        ${pays.map(p=>`<tr>

  mAc(`<div class="m-h"><h3>Klinik kartı</h3><button class="x" onclick="mKapat()">×</button></div>
  <div class="m-b" style="padding:0;max-height:none;display:block">

function klinikGuncelle(cid){
  if(!canEditKlinik()){ toast('Düzenleme yetkiniz yok.'); return; }
  const c = S.clinics.find(x=>x.id===cid); if(!c) return;
  const ad = (document.getElementById('kk_ad')?.value||'').trim();
  if(!ad){ toast('Klinik adı zorunlu.'); return; }
  const semt = (document.getElementById('kk_semt')?.value||'').trim();
  c.ad = ad;
  c.brans = (document.getElementById('kk_br')?.value||'').trim();
  c.yetkili = (document.getElementById('kk_yet')?.value||'').trim();
  c.unvan = (document.getElementById('kk_unv')?.value||'').trim();
  c.tel = (document.getElementById('kk_tel')?.value||'').trim();
  c.email = (document.getElementById('kk_em')?.value||'').trim();
  c.web = (document.getElementById('kk_web')?.value||'').trim();
  c.hekimSayisi = (document.getElementById('kk_hek')?.value||'').trim();
  c.sehir = (document.getElementById('kk_seh')?.value||'').trim();
  c.semt = semt; c.ilce = semt;
  c.bolge = (document.getElementById('kk_bol')?.value||'').trim();
  c.adres = (document.getElementById('kk_adr')?.value||'').trim();
  c.vergi = (document.getElementById('kk_verg')?.value||'').trim();
  c.kaynak = (document.getElementById('kk_kay')?.value||'').trim();
  c.olcek = (document.getElementById('kk_olc')?.value||'').trim();
  c.uluslararasi = (document.getElementById('kk_ul')?.value||'').trim();
  c.skor = Number(document.getElementById('kk_sk')?.value)||c.skor||3;
  c.sorumlu = document.getElementById('kk_sr')?.value||'';
  // hatirlatma / segment dokunulmaz
  kaydet(); toast('Klinik kartı güncellendi.'); klinikAc(cid,'detay'); ciz();
}
function klinikHizliNotKaydet(cid){
  const c = S.clinics.find(x=>x.id===cid); if(!c) return;
  const metin = (document.getElementById('kk_hn')?.value||'').trim();
  if(!metin){ toast('Not boş olamaz.'); return; }
  c.hizliNot = metin;
  c.notGecmisi = c.notGecmisi || [];
  const d = new Date();
  c.notGecmisi.unshift({
    id:uid(), metin,
    kim: ME.ad,
    tarihTR: `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
  });
  kaydet(); toast('Not kaydedildi.'); klinikAc(cid,'notlar');
}

}
function klinikHizliNotDuzenleKaydet(cid, nid){
  const c = S.clinics.find(x=>x.id===cid); if(!c) return;

  const sk = document.getElementById('kk_g_son')?.value||'gorusuldu';

  const next = document.getElementById('kk_g_next')?.value||'';
  const metin = [tip, kisi?('Kişi: '+kisi):'', notu].filter(Boolean).join(' · ');
  segmentAta(cid, sk, metin);
  // Opsiyonel sonraki adım: yalnızca kullanıcı tarih girdiyse ve randevu değilse override

  }

function klinikDosyaEkle(cid, input){
  if(!canEditKlinik()){ toast('Düzenleme yetkiniz yok.'); return; }
  ensureExtras();
  const f = input.files && input.files[0]; if(!f) return;
  const kb = Math.max(1, Math.round(f.size/1024));
  S.files.unshift({
    id:uid(), clinicId:cid, ad:f.name, tip:f.type||'',
    boyut: kb>1024? ((kb/1024).toFixed(1)+' MB') : (kb+' KB'),
    tarih: bugun(), userId:ME.id
  });
  input.value='';
  kaydet(); toast('Belge eklendi.'); klinikAc(cid,'dosya');
}

}

function randevuYeni(t,s){
  const st = slotDurum(t,s);
  const secilebilir = S.clinics.filter(c=>['randevu','sicak','teklif','gorusuldu','mesaj','kisa','orta','uzun','gun1','gun2','ulasilamadi','karar','aranmadi','pilot'].includes(c.segment))
    .sort((a,b)=>{const p=x=>x.segment==='randevu'?0:(SEG[x.segment]?.kat==='sicak'?1:2); return p(a)-p(b) || (b.skor||0)-(a.skor||0);});
  mAc(`<div class="m-h"><h3>Randevu oluştur — ${tarihTR(t)} · ${s}</h3><button class="x" onclick="mKapat()">×</button></div>
  <div class="m-b">
    <div><label class="f">Klinik</label>
      <select id="rk">${secilebilir.map(c=>`<option value="${c.id}" ${c.segment==='randevu'?'':''}>${esc(c.ad)} — ${esc(c.semt||'')} ${c.segment==='randevu'?'· randevu bekliyor':''}</option>`).join('')}</select></div>
    <div><label class="f">Kim gidecek?</label>
      <div class="row">${USERS.filter(u=>u.saha).map(u=>{
        const mesgul = st.mesgul.includes(u.id);
        return `<label style="flex:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;${mesgul?'opacity:.45':''}">
          <input type="checkbox" class="rkat" value="${u.id}" ${mesgul?'disabled':'checked'} style="width:auto">
          <span class="av" style="background:${u.renk};width:24px;height:24px;font-size:10px">${bas(u.ad)}</span>
          <span>${u.ad.split(' ')[0]}${mesgul?' (meşgul)':''}</span></label>`}).join('')}</div></div>
    <div><label class="f">Not (isteğe bağlı)</label><input type="text" id="rn" placeholder="Kiminle görüşülecek, hangi kata çıkılacak…"></div>
    <div class="sml mut">Kaydedildiğinde seçilen kişilere bildirim düşer ve klinik "Randevu Verildi" sekmesine geçer.</div>
  </div>
  <div class="m-f"><button class="btn" onclick="mKapat()">Vazgeç</button><button class="btn p" onclick="randevuKaydet('${t}','${s}')">Randevuyu oluştur</button></div>`);
}
function randevuMailGonder(payload){
  if(CFG.BACKEND!=='server') return;
  fetch(CFG.API_NOTIFY, {
    method:'POST',
    credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).catch(()=>{});
}
function randevuKaydet(t,s){
  const cid = document.getElementById('rk').value;
  const kat = [...document.querySelectorAll('.rkat:checked')].map(x=>x.value);
  if(!kat.length){ toast('En az bir kişi seç.'); return; }
  const c = S.clinics.find(x=>x.id===cid);
  const notu = document.getElementById('rn').value;
  S.appts.push({id:uid(), clinicId:cid, tarih:t, saat:s, katilimcilar:kat, olusturan:ME.id, durum:'planli', notu});
  c.segment='randevu'; c.hatirlatma=null;
  S.notes.unshift({id:uid(),clinicId:cid,userId:ME.id,tarih:new Date().toISOString(),segment:'randevu',metin:`Randevu alındı: ${tarihTR(t)} ${s}`});
  bildirim(kat, `Yeni randevu: ${c.ad} · ${tarihTR(t)} ${s}`, 'randevu');
  randevuMailGonder({
    event:'created', clinic:c.ad, tarih:t, saat:s,
    adres:c.adres||'', tel:c.tel||'', notu:notu||'',
    olusturan:ME.ad,
    katilimcilar: kat.map(i=>usr(i).ad)
  });
  kaydet(); mKapat(); toast('Randevu oluşturuldu — panel + mail bildirimi.'); ciz();
}

/* --- Excel al/ver --- */
function isHeaderClinic(ad, brans, tel){
  const a = String(ad||'').trim().toLocaleLowerCase('tr');
  const b = String(brans||'').trim().toLocaleLowerCase('tr');
  const t = String(tel||'').trim().toLocaleLowerCase('tr');
  if(!a) return true;
  const badAd = ['işletme adı','isletme adi','ad','klinik adı','klinik adi','firma','firma adı'];
  const badBr = ['branş','brans'];
  const badTel = ['telefon','tel','gsm'];
  if(badAd.includes(a)) return true;
  if(badBr.includes(b) && badTel.includes(t)) return true;
  if(b==='branş' || b==='brans') return true;
  if(t==='telefon') return true;
  return false;
}


function excelYukle(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = e=>{
    const wb = XLSX.read(e.target.result, {type:'array'});
    const prefer = ['Arama Listesi (Öncelikli)','2. Dalga (İskelet Branşlar)','Arama Listesi'];
    const name = prefer.find(n=>wb.SheetNames.includes(n))
      || wb.SheetNames.find(n=>/arama|list|dalga|klinik/i.test(n))
      || wb.SheetNames[0];
    const sh = wb.Sheets[name];
    const matrix = XLSX.utils.sheet_to_json(sh, {header:1, defval:''});
    let headerRow = -1;
    for(let i=0;i<Math.min(matrix.length,30);i++){
      const joined = matrix[i].map(x=>String(x||'').toLocaleLowerCase('tr')).join('|');
      if(joined.includes('işletme') || joined.includes('isletme') || (joined.includes('klinik') && joined.includes('bran'))){
        headerRow = i; break;
      }
    }
    if(headerRow<0){ toast('Başlık satırı bulunamadı ('+name+')'); inp.value=''; return; }
    const headers = matrix[headerRow].map(h=>String(h||'').trim());
    const fold = s=>String(s||'').toLocaleLowerCase('tr');
    const col = (...keys)=>{
      for(let i=0;i<headers.length;i++){
        const h=fold(headers[i]);
        if(keys.some(k=>h.includes(fold(k)))) return i;
      }
      return -1;
    };
    const iAd=col('işletme','isletme','klinik adı','firma');
    const iBr=col('branş','brans');
    const iSemt=col('semt','ilçe','ilce');
    const iBol=col('bölge','bolge');
    const iAdr=col('adres');
    const iTel=col('telefon','tel','gsm');
    const iWeb=col('web','site');
    const iOl=col('ölçek','olcek','tahmini');
    const iUl=col('uluslararası','uluslararasi');
    const iSk=col('skor','puan');
    const iSr=col('sorumlu');
    if(iAd<0){ toast('İşletme Adı sütunu yok'); inp.value=''; return; }
    const cell=(row,i)=> i>=0 && i<row.length ? String(row[i]??'').trim() : '';
    let added=0, updated=0, hat=0;
    for(let r=headerRow+1;r<matrix.length;r++){
      const row=matrix[r];
      const ad=cell(row,iAd);
      const brans=cell(row,iBr);
      const tel=cell(row,iTel);
      if(!ad || isHeaderClinic(ad,brans,tel)) continue;
      const payload={
        ad, brans,
        semt:cell(row,iSemt), bolge:cell(row,iBol), adres:cell(row,iAdr),
        tel, web:cell(row,iWeb), olcek:cell(row,iOl), uluslararasi:cell(row,iUl),
        skor:Number(cell(row,iSk))||3, sorumlu:cell(row,iSr)
      };
      const mevcut=S.clinics.find(c=>(c.ad||'').toLowerCase()===ad.toLowerCase());
      if(mevcut){
        Object.keys(payload).forEach(k=>{ if(payload[k]!=='' && payload[k]!=null) mevcut[k]=payload[k]; });
        if((mevcut.segment||'aranmadi')==='aranmadi' && mevcut.sorumlu && !mevcut.hatirlatma){
          mevcut.hatirlatma=bugun(); hat++;
        }
        updated++;
      }else{
        const c={
          id:'c'+uid(), ...payload, dalga: /2\.?\s*dalga/i.test(name)?2:1,
          segment:'aranmadi', sonArama:null, hatirlatma:null, aramaSayisi:0
        };
        if(c.sorumlu){ c.hatirlatma=bugun(); hat++; }
        S.clinics.push(c); added++;
      }
    }
    kaydet();
    toast(`${name}: +${added} yeni, ${updated} güncellendi`+(hat?`, ${hat} Dinamik'e alındı`:''));
    ciz(); inp.value='';
  };
  rd.readAsArrayBuffer(f);
}

      ${rnd.sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat)).slice(0,6).map(a=>{const c=S.clinics.find(x=>x.id===a.clinicId)||{};
        return `<tr><td class="mono sml"><b>${tarihTR(a.tarih)}</b></td><td class="mono"><b>${a.saat}</b></td>
        <td>${klinikLink(a.clinicId, c.ad||'—')}</td><td class="sml mut">${esc(c.semt||'')}</td>
        <td>${a.katilimcilar.map(i=>`<span class="tag" style="background:${usr(i).renk}1A;color:${usr(i).renk}">${usr(i).ad.split(' ')[0]}</span>`).join(' ')}</td></tr>`}).join('')}
      </tbody></table></div></div>` : `
      <div class="card"><div class="empty"><div class="e">▦</div>Henüz planlanmış randevu yok.<br><span class="sml">Kader Hanım takvimden ilk randevuyu oluşturduğunda burada görünecek.</span></div></div>`}

    <div style="text-align:center;color:var(--mut);font-size:11.5px;padding:26px 0 10px">
      Nefalix Saha CRM · İç kullanım aracıdır, dışarıya paylaşılmaz.
      ${CFG.BACKEND!=='server' ? '<br><b style="color:var(--warn)">Yerel mod:</b> veriler sadece bu tarayıcıda tutuluyor. Ekip ortak çalışacaksa Ayarlar → Sunucu Bağlantısı.' : ''}
    </div>
  </div>`;
}

/* ============ GİRİŞ ============ */
async function sunucuGiris(kod){
  const r = await fetch(CFG.API_LOGIN, {
    method:'POST',
    credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ kod })
  });
  if(!r.ok){
    let msg='Sunucu girişi başarısız';
    try{ const j=await r.json(); if(j.error) msg=j.error; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}
async function crmYukle(){
  const kayit = await Depo.oku();
  S = (kayit && kayit.clinics && kayit.clinics.length) ? kayit : bosDurum();
  ensureExtras();
  ['notes','busy','appts','notifs','offers','payments','files'].forEach(k=>{ if(!S[k]) S[k]=[]; }); ensureExtras();
  if(!(kayit && kayit.clinics && kayit.clinics.length)) await Depo.yaz(S);
}
async function girisYap(){
  const kod = (document.getElementById('lg_id').value||'').trim().toLowerCase();
  const err = document.getElementById('lg_err');
  const u = USERS.find(x=>x.kod===kod);
  if(!u){
    err.textContent = 'Kullanıcı adı hatalı. (enes / abdulkadir / kader / destek)';
    setTimeout(()=>err.textContent='', 3500);
    return;
  }
  err.textContent='';
  try{
    if(CFG.BACKEND==='server') await sunucuGiris(kod);
    await crmYukle();
    await giris(u.id);
  }catch(e){
    err.textContent = e.message || 'Giriş başarısız';
    setTimeout(()=>err.textContent='', 4500);
  }
}
async function giris(id){
  ME = USERS.find(u=>u.id===id);
  try{ sessionStorage.setItem('nfx_me', id); }catch(e){}
  document.getElementById('ana').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('meav').textContent = bas(ME.ad);
  document.getElementById('meav').style.background = ME.renk;
  document.getElementById('mead').textContent = ME.ad;
  document.getElementById('merol').textContent = ME.rol;
  git(baslangicSayfasi(ME.id));
}
function cikis(){
  try{ sessionStorage.removeItem('nfx_me'); }catch(e){}
  if(CFG.BACKEND==='server'){
    fetch(CFG.API_LOGOUT, { method:'POST', credentials:'include' }).finally(()=>location.reload());
    return;
  }
  location.reload();
}

document.querySelectorAll('.nav[data-p]').forEach(b=>b.onclick=()=>git(b.dataset.p));
window.addEventListener('hashchange', ()=>{
  const p = (location.hash||'').replace(/^#/,'').trim();
  if(ME && p && SAYFALAR[p] && p !== SAYFA) git(p, {silent: true});
});

(async function init(){
  S = bosDurum();
  ensureExtras();
  ['notes','busy','appts','notifs','offers','payments','files'].forEach(k=>{ if(!S[k]) S[k]=[]; }); ensureExtras();
  anaCiz();
  let m=null; try{ m=sessionStorage.getItem('nfx_me'); }catch(e){}
  if(m && USERS.some(u=>u.id===m)){
    try{
      // Cookie hâlâ geçerliyse ortak veriyi yükle; değilse yeniden giriş
      const kayit = await Depo.oku();
      if(kayit && kayit.clinics){
        S = kayit;
        ['notes','busy','appts','notifs','offers','payments','files'].forEach(k=>{ if(!S[k]) S[k]=[]; }); ensureExtras();
        await giris(m);
      } else {
        try{ sessionStorage.removeItem('nfx_me'); }catch(e){}
      }
    }catch(e){ try{ sessionStorage.removeItem('nfx_me'); }catch(e2){} }
  }

  if(CFG.BACKEND==='server'){
    setInterval(async ()=>{
      if(!ME) return;
      const uzak = await Depo.oku();
      if(uzak && uzak.rev > (S.rev||0)){ S = uzak; ciz(); durumIsigi('güncellendi'); }
    }, CFG.POLL_MS);
  }
})();
</script>
