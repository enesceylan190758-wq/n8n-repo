<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nefalix · İletişim Sistemi</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#6320EE; --blue:#2E6BFF; --cyan:#00C2FF; --mint:#2FE6B0;
  --ink:#080B1A; --ink2:#0D1226; --panel:#141A34; --panel2:#1B2242;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14);
  --txt:#EBEDF7; --muted:#98A0C4; --muted2:#6E769B;
  --grad:linear-gradient(135deg,#6320EE 0%,#2E6BFF 48%,#00C2FF 100%);
  --grad-mint:linear-gradient(135deg,#2E6BFF,#2FE6B0);
  --radius:18px; --shadow:0 24px 60px -28px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif; color:var(--txt);
  background:
    radial-gradient(900px 500px at 80% -10%, rgba(99,32,238,.28), transparent 60%),
    radial-gradient(800px 500px at 0% 10%, rgba(0,194,255,.16), transparent 55%),
    var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.55; min-height:100%;
}
h1,h2,h3,.disp{font-family:'Sora',sans-serif}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}

/* ---------- shell ---------- */
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:82px}
.topbar{
  display:flex;align-items:center;gap:11px;padding:16px 18px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--ink),rgba(8,11,26,.86));backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:#fff;padding:4px;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,194,255,.6)}
.brand .logo img{width:100%;height:100%;object-fit:contain;border-radius:6px}
.brand .name{font-family:'Sora';font-weight:700;letter-spacing:.14em;font-size:16px}
.brand .name b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:9.5px;letter-spacing:.16em;color:var(--muted2);text-transform:uppercase;margin-top:1px}
.topbar .spacer{flex:1}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line2);padding:5px 11px;border-radius:20px;display:flex;align-items:center;gap:6px}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(13,18,38,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted2);font-size:10.5px;font-weight:600;transition:.18s}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9}
.tabbar button.on{color:var(--txt)}
.tabbar button.on svg{stroke:url(#tabgrad)}
.tabbar button.on .lbl{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- views ---------- */
.view{padding:6px 18px 26px;animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view.hide{display:none}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2);font-weight:600;margin:4px 0 3px}
.h-title{font-size:21px;font-weight:700;margin-bottom:14px}

/* ---------- profile switch ---------- */
.pswitch{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px}
.pswitch button{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);transition:.18s}
.pswitch button.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px -10px var(--blue)}

/* ---------- business card ---------- */
.card{
  position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(180deg,var(--panel2),var(--ink2));box-shadow:var(--shadow);
}
.card .cardtop{position:relative;padding:22px 22px 18px;background:var(--grad);overflow:hidden}
.card .cardtop::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%)}
.card .cl-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.card .clogo{width:40px;height:40px;border-radius:11px;background:#fff;padding:5px;display:grid;place-items:center}
.card .clogo img{width:100%;height:100%;object-fit:contain}
.card .cbrand{font-family:'Sora';font-weight:700;letter-spacing:.14em;font-size:15px;color:#fff}
.card .cbrand small{display:block;font-weight:500;letter-spacing:.1em;font-size:8.5px;opacity:.8;text-transform:uppercase}
.card .person{display:flex;align-items:center;gap:15px;position:relative;z-index:2;margin-top:16px}
.card .avatar{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;font-family:'Sora';font-weight:700;font-size:24px;color:#fff;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4);backdrop-filter:blur(4px)}
.card .pn{font-family:'Sora';font-weight:700;font-size:20px;color:#fff;line-height:1.2}
.card .pt{font-size:13px;color:rgba(255,255,255,.92);font-weight:500;margin-top:2px}
.card .pc{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:1px}

.card .cardbody{padding:18px 20px 20px}
.crow{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:none}
.crow .ic{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.crow .ic svg{width:16px;height:16px;stroke:var(--cyan);fill:none;stroke-width:1.9}
.crow .lab{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em}
.crow .val{font-size:13.5px;color:var(--txt);font-weight:500;word-break:break-word}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--muted);transition:.16s}
.act:active{transform:scale(.95)}
.act svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9}
.act.pri{background:var(--grad-mint);color:#04120c;border:none}
.act.wa{background:linear-gradient(135deg,#22c35e,#12a150);color:#fff;border:none}

.qrbox{margin-top:16px;background:#fff;border-radius:16px;padding:16px;display:flex;align-items:center;gap:15px}
.qrbox img{width:104px;height:104px;border-radius:9px;flex:0 0 auto}
.qrbox .qt{color:#0B1020}
.qrbox .qt .qh{font-family:'Sora';font-weight:700;font-size:14px}
.qrbox .qt .qs{font-size:11.5px;color:#5A6685;margin-top:3px;line-height:1.45}

.share-lite{display:flex;gap:9px;margin-top:14px}
.share-lite button{flex:1;padding:12px;border-radius:13px;font-weight:600;font-size:13px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);display:flex;align-items:center;justify-content:center;gap:8px}
.share-lite button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}

/* ---------- templates ---------- */
.recip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:14px}
.recip .rl{font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.recip .rin{display:flex;gap:9px}
.recip input{flex:1;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--txt);font-size:13px}
.recip input:focus{outline:none;border-color:var(--blue)}

.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);transition:.16s}
.chip.on{color:#fff;background:var(--grad);border-color:transparent}

.tpl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
.tpl .th{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.tpl .tt{font-family:'Sora';font-weight:600;font-size:14.5px}
.tpl .badges{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:7px;letter-spacing:.02em}
.badge.ch{background:rgba(0,194,255,.14);color:#63d6ff}
.badge.st{background:rgba(47,230,176,.14);color:var(--mint)}
.tpl .subj{font-size:12px;color:var(--muted);margin-bottom:7px}
.tpl .subj b{color:var(--txt)}
.tpl .bodyprev{font-size:12.5px;color:#C3C9E6;white-space:pre-wrap;background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:11px;max-height:130px;overflow:auto;line-height:1.5}
.tpl .tacts{display:flex;gap:8px;margin-top:11px}
.tpl .tacts button{flex:1;padding:10px;border-radius:11px;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:7px}
.tpl .tacts button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn-copy{background:var(--panel2);border:1px solid var(--line2);color:var(--txt)}
.btn-send{background:var(--grad);color:#fff}

/* ---------- process ---------- */
.flow{position:relative;padding-left:8px}
.stage{position:relative;padding:0 0 8px 34px;margin-bottom:6px}
.stage::before{content:"";position:absolute;left:11px;top:26px;bottom:-6px;width:2px;background:linear-gradient(var(--blue),transparent)}
.stage:last-child::before{display:none}
.stage .num{position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-family:'Sora';font-weight:700;font-size:12px;color:#fff}
.stage .scard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}
.stage .sh{font-family:'Sora';font-weight:600;font-size:15px}
.stage .smeta{display:flex;gap:7px;margin:8px 0 9px;flex-wrap:wrap}
.stage .stag{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.stage .stag b{color:var(--cyan)}
.stage .sd{font-size:12.5px;color:var(--muted);line-height:1.5}
.stage .sgo{margin-top:10px;font-size:12px;font-weight:600;color:var(--mint);display:inline-flex;align-items:center;gap:6px}
.stage .sgo svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- settings ---------- */
.sect{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sect .sect-h{display:flex;align-items:center;gap:9px;font-family:'Sora';font-weight:600;font-size:14.5px;margin-bottom:4px}
.sect .sect-h svg{width:17px;height:17px;stroke:var(--cyan);fill:none;stroke-width:1.9}
.sect .sect-s{font-size:11.5px;color:var(--muted2);margin-bottom:13px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:13px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--blue)}
.fld textarea{resize:vertical;min-height:84px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subtabs{display:flex;gap:7px;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.subtabs button{flex:1;padding:8px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.subtabs button.on{background:var(--panel2);color:var(--txt)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{padding:11px 15px;border-radius:12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:.16s}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn.g{background:var(--grad);color:#fff;flex:1;justify-content:center}
.btn.o{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);flex:1;justify-content:center}
.btn.danger{background:rgba(255,80,90,.12);border:1px solid rgba(255,80,90,.3);color:#ff7b85}
.tpl-edit{background:var(--ink2);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:11px}
.tpl-edit .teh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.tpl-edit .teh .tename{font-weight:600;font-size:13px}
.iconbtn{width:30px;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.hint{font-size:11px;color:var(--muted2);line-height:1.5;margin-top:8px}
.hint code{background:var(--panel2);padding:1px 5px;border-radius:5px;color:var(--cyan);font-size:10.5px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);z-index:100;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.28s;display:flex;align-items:center;gap:9px;max-width:88%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:17px;height:17px;stroke:var(--mint);fill:none;stroke-width:2.2}

@media(max-width:380px){.actions{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

  save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} },
  load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
};
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
let DB = store.load() || deepClone(DEFAULTS);
// yeni alanlar eklendiyse defaults ile birleştir
DB.company = Object.assign({}, DEFAULTS.company, DB.company||{});

function persist(){ store.save(DB); }

let recip={ name:"", firm:"" };

/* ---------- yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function titleShort(t){ return /CEO/i.test(t)?"kurucusu":( /CTO/i.test(t)?"kurucu ortağı":"kurucusu"); }

function fillTemplate(body, p){
  return body
    .replaceAll("{name}", p.name)
    .replaceAll("{title}", p.title)
    .replaceAll("{titleShort}", titleShort(p.title))
    .replaceAll("{email}", p.email)
    .replaceAll("{phone}", p.phone)
    .replaceAll("{web}", p.web)
    .replaceAll("{calUrl}", p.calUrl||"https://cal.com/enes-ceylan/15min")
    .replaceAll("{cardUrl}", p.cardUrl||("https://nefalix.com/k/"+(p.key==="enes"?"enes":"abdulkadir")))
    .replaceAll("[İsim]", recip.name||"[İsim]")
    .replaceAll("[Firma]", recip.firm||"[Firma]");
}
function fillSubject(s){ return (s||"").replaceAll("[Firma]", recip.firm||"[Firma]"); }

function toast(msg){
  const t=$("#toast"); $("#toastMsg").textContent=msg;
  t.classList.add("show"); clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove("show"),1900);
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const a=document.createElement("textarea"); a.value=txt; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Kopyalandı ✓");
}
function digits(s){ return (s||"").replace(/[^0-9+]/g,""); }

/* ---------- vCard ---------- */
function vcard(p){
  const parts=p.name.trim().split(" "); const last=parts.pop()||""; const first=parts.join(" ");
  return ["BEGIN:VCARD","VERSION:3.0",
    `N:${last};${first};;;`,`FN:${p.name}`,`ORG:${DB.company.name}`,`TITLE:${p.title}`,
    `TEL;TYPE=CELL:${digits(p.phone)}`,`EMAIL:${p.email}`,`URL:https://${p.web.replace(/^https?:\/\//,"")}`,
    `ADR;TYPE=WORK:;;${p.address};;;;`,"END:VCARD"].join("\n");
}
function downloadVcf(p){
  const blob=new Blob([vcard(p)],{type:"text/vcard"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=(p.name.replace(/\s+/g,"_"))+".vcf"; a.click(); URL.revokeObjectURL(a.href);
  toast("Kişi kartı indirildi ✓");
}

let chFilter="Tümü";
function renderFilters(){
  const chans=["Tümü",...new Set(DB.templates.map(t=>t.channel))];
  const m=$("#chFilters"); m.innerHTML="";
  chans.forEach(ch=>{
    const b=document.createElement("button"); b.className="chip"+(chFilter===ch?" on":""); b.textContent=ch;
    b.onclick=()=>{ chFilter=ch; renderFilters(); renderTemplates(); }; m.appendChild(b);
  });
}
function renderTemplates(){
  const p=DB.profiles[DB.active];
  $("#activeSender").textContent=p.name;
  const list=DB.templates.filter(t=>chFilter==="Tümü"||t.channel===chFilter);
  const m=$("#tplMount"); m.innerHTML="";
  if(!list.length){ m.innerHTML=`<div class="hint">Bu kanalda kalıp yok. Ayarlar > Kalıplar'dan ekleyebilirsiniz.</div>`; return; }
  list.forEach(t=>{
    const body=fillTemplate(t.body,p); const subj=fillSubject(t.subject);
    const el=document.createElement("div"); el.className="tpl";
    el.innerHTML=`
      <div class="th"><div><div class="tt">${esc(t.title)}</div>
        <div class="badges"><span class="badge ch">${esc(t.channel)}</span><span class="badge st">${esc(t.stage)}</span></div></div></div>
      ${subj?`<div class="subj">Konu: <b>${esc(subj)}</b></div>`:""}
      <div class="bodyprev">${esc(body)}</div>
      <div class="tacts">
        <button class="btn-copy" data-copy>${icon("copy")}Kopyala</button>
        <button class="btn-send" data-send>${icon("share")}${t.channel==="E-posta"?"Mail aç":(t.channel==="WhatsApp"?"WhatsApp":"Aç")}</button>
      </div>`;
    el.querySelector("[data-copy]").onclick=()=>copyText((subj?("Konu: "+subj+"\n\n"):"")+body);
    el.querySelector("[data-send]").onclick=()=>sendTemplate(t.channel, subj, body, p);
    m.appendChild(el);
  });
}
function sendTemplate(channel, subj, body, p){
  if(channel==="E-posta"){
    location.href=`mailto:?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  }else if(channel==="WhatsApp"){
    window.open(`https://wa.me/?text=${encodeURIComponent(body)}`,"_blank");
  }else{ copyText(body); toast("Kopyalandı — LinkedIn'e yapıştırın ✓"); }
}

/* ============ router / tabs ============ */
function switchTab(t){
  $$(".view").forEach(v=>v.classList.add("hide"));
  $("#view-"+t).classList.remove("hide");
  $$("#tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(location.hash.split("/")[0]!=="#kart" || t!=="kart") location.hash=t;
  window.scrollTo(0,0);
}
$$("#tabbar button").forEach(b=>b.onclick=()=>switchTab(b.dataset.t));
$$("#setTabs button").forEach(b=>b.onclick=()=>{ setTab=b.dataset.s; $$("#setTabs button").forEach(x=>x.classList.toggle("on",x===b)); renderSettings(); });
$("#recipName").oninput=e=>{ recip.name=e.target.value.trim(); renderTemplates(); };
$("#recipFirm").oninput=e=>{ recip.firm=e.target.value.trim(); renderTemplates(); };

function renderAll(){ renderSwitch(); renderCard(); renderFilters(); renderTemplates(); renderFlow(); renderSettings(); }


/* ---------- CRM / URL deep-link ---------- */
function applyQueryParams(){
  try{
    const sp = new URLSearchParams(location.search);
    const name = (sp.get("name")||sp.get("isim")||"").trim();
    const firm = (sp.get("firm")||sp.get("firma")||"").trim();
    const who = (sp.get("kart")||sp.get("from")||"").trim().toLowerCase();
    if(name) recip.name = name;
    if(firm) recip.firm = firm;
    if(who==="enes"||who==="ec") DB.active="enes";
    if(who==="kadir"||who==="abdulkadir"||who==="ak"||who==="ay") DB.active="kadir";
    if(name||firm){ persist(); switchTab("kaliplar"); }
  }catch(e){}
}
function mergeFreshProfiles(){
  const ph=/5XX|XXX|^\s*$/;
  Object.keys(DEFAULTS.profiles).forEach(k=>{
    const d=DEFAULTS.profiles[k];
    const cur=DB.profiles[k]||{};
    DB.profiles[k]=Object.assign({}, d, cur, {
      phone: (!cur.phone||ph.test(cur.phone))?d.phone:cur.phone,
      whatsapp: (!cur.whatsapp||ph.test(cur.whatsapp))?d.whatsapp:cur.whatsapp,
      linkedin: cur.linkedin||d.linkedin,
      instagram: cur.instagram||d.instagram,
      youtube: cur.youtube||d.youtube,
      cardUrl: cur.cardUrl||d.cardUrl,
      calUrl: cur.calUrl||d.calUrl,
      email: cur.email||d.email
    });
  });
  persist();
}

function bootFromHash(){
  const h=location.hash.replace("#",""); const [tab,prof]=h.split("/");
  if(prof && DB.profiles[prof]){ DB.active=prof; }
  const valid=["kart","kaliplar","surec","ayarlar"];
  switchTab(valid.includes(tab)?tab:"kart");
  renderSwitch(); renderCard();
}

mergeFreshProfiles();
bootFromHash();
applyQueryParams();
renderAll();
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#","").split("/")[0]; if(["kart","kaliplar","surec","ayarlar"].includes(h)){} });
</script>
