<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>CRM kapatıldı — Nefalix</title>
  <link rel="icon" href="/assets/brand/nefalix-logo.png" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --line: rgba(148, 163, 184, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.18), transparent),
        var(--bg);
    }
    main {
      width: min(440px, 100%);
      padding: 32px 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
    .brand {
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
    }
    a.btn:hover { filter: brightness(1.06); }
    .note {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Nefalix</div>
    <h1>Bu CRM kapatıldı</h1>
    <p>
      Eski Klinik CRM ve Saha CRM prod’da devre dışı.
      Yeni kurum CRM altyapısı canlıya alındı.
    </p>
    <a class="btn" href="/nefalix-crm">Yeni Nefalix CRM’e git</a>
    <p class="note">Eski adresler bilerek kapalı tutuluyor.</p>
  </main>
</body>
</html>
