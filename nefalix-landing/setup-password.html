<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- nefalix-seo-start -->
<meta name="robots" content="noindex, nofollow">
<!-- nefalix-seo-end -->
  <title>Şifre Oluştur | Nefalix</title>
  <link rel="icon" href="/assets/brand/favicon-192.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/nefalix-dashboard.css" />
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-brand">
      <img src="/assets/brand/nefalix-logo.png" alt="Nefalix" class="login-logo" />
      <h1>Panel şifrenizi oluşturun</h1>
      <p>Firma hesabınız aktifleştirildiğinde aynı e-posta ile dashboard’a giriş yapabilirsiniz.</p>
    </div>
    <div class="login-card">
      <h2>Yeni şifre</h2>
      <p class="login-sub" id="setup-email">Kurulum bilgisi kontrol ediliyor…</p>
      <form id="setup-form" class="login-form">
        <label>
          <span>Şifre</span>
          <input type="password" id="password" autocomplete="new-password" minlength="8" required placeholder="En az 8 karakter" />
        </label>
        <label>
          <span>Şifre tekrar</span>
          <input type="password" id="password2" autocomplete="new-password" minlength="8" required placeholder="Tekrar yazın" />
        </label>
        <p id="setup-error" class="login-error hidden"></p>
        <button type="submit" id="setup-btn" class="btn-primary btn-block">Şifreyi oluştur</button>
      </form>
      <p class="login-foot"><a href="/dashboard/login">Giriş ekranına dön</a></p>
    </div>
  </div>
  <script type="module" src="/nefalix-setup-password.js"></script>
</body>
</html>
