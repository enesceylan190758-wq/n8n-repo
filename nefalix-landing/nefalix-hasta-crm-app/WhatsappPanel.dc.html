<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-conv:hover { background:#f4f2fb !important; }
  .nf-btn:hover { filter:brightness(1.07); }
  .nf-send:focus { border-color:#16a34a !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="whatsapp" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:22px 28px 30px;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <div style="width:38px; height:38px; border-radius:9px; background:#16a34a; display:flex; align-items:center; justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5.1-1.3A10 10 0 1012 2zm5.6 14.3c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.2-3.5-.7-2.9-1.2-4.8-4.2-5-4.4-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.6c-.1.2-.2.3 0 .6.2.3.9 1.5 1.9 2.4 1.3 1.1 2.3 1.5 2.6 1.6.3.1.4.1.6-.1l.9-1c.2-.3.4-.2.7-.1l1.8.9c.2.1.4.2.4.4.1.2.1.9-.1 1.6z"></path></svg></div>
      <span style="font-size:18px; font-weight:700; color:#241854;">Whatsapp Yönetim Paneli</span>
      <span style="background:#dcfce7; color:#15803d; font-size:12px; font-weight:600; padding:5px 12px; border-radius:20px;">● Bağlı — Meta Business API</span>
    </div>

    <div style="display:grid; grid-template-columns:340px 1fr; gap:0; background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden; height:620px;">
      <div style="border-right:1px solid #f0eef8; display:flex; flex-direction:column;">
        <div style="padding:14px 18px; border-bottom:1px solid #f0eef8; font-size:14px; font-weight:700; color:#241854;">Sohbetler</div>
        <div style="flex:1; overflow-y:auto;">
          <sc-for list="{{ convs }}" as="c" hint-placeholder-count="8">
            <div class="nf-conv" onClick="{{ c.pick }}" style="{{ c.style }}">
              <div style="width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#16a34a,#22c55e); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0;">{{ c.initial }}</div>
              <div style="flex:1; min-width:0;">
                <div style="display:flex; justify-content:space-between; gap:8px;"><span style="font-size:13.5px; font-weight:600; color:#241854;">{{ c.ad }}</span><span style="font-size:10.5px; color:#9c98b8; white-space:nowrap;">{{ c.time }}</span></div>
                <div style="font-size:12px; color:#8b87a8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;">{{ c.last }}</div>
              </div>
              <sc-if value="{{ c.unread }}" hint-placeholder-val="{{ false }}"><span style="background:#16a34a; color:#fff; font-size:10px; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px;">{{ c.unreadCount }}</span></sc-if>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; background:#f5f3ef;">
        <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ true }}">
          <div style="padding:13px 20px; background:#fff; border-bottom:1px solid #f0eef8; display:flex; align-items:center; gap:10px;">
            <div style="width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#16a34a,#22c55e); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700;">{{ active.initial }}</div>
            <div><div style="font-size:14px; font-weight:700; color:#241854;">{{ active.ad }}</div><div style="font-size:11.5px; color:#8b87a8;">{{ active.tel }}</div></div>
            <div style="flex:1;"></div>
            <a href="{{ active.href }}" style="font-size:12.5px; font-weight:600; color:#7c3aed;">Hasta kartı →</a>
          </div>
          <div style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px;">
            <sc-for list="{{ messages }}" as="m" hint-placeholder-count="5"><div style="{{ m.wrapStyle }}"><div style="{{ m.bubbleStyle }}">{{ m.text }}<span style="{{ m.timeStyle }}">{{ m.time }}</span></div></div></sc-for>
          </div>
          <div style="padding:14px 18px; background:#fff; border-top:1px solid #f0eef8; display:flex; gap:10px; align-items:center;">
            <input class="nf-send" key="{{ msgKey }}" placeholder="Mesaj yazın..." onInput="{{ onMsg }}" onKeyDown="{{ onKey }}" style="flex:1; border:1px solid #d9d5ee; border-radius:22px; padding:11px 18px; font-size:13.5px; outline:none;" />
            <div class="nf-btn" onClick="{{ send }}" style="width:44px; height:44px; border-radius:50%; background:#16a34a; display:flex; align-items:center; justify-content:center; cursor:pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></div>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
  <div style="padding:16px 28px; display:flex; justify-content:space-between; font-size:12px; color:#9c98b8;"><span>Nefalix 2026 © <strong style="color:#6b6785;">v160726_01</strong></span><span>Benzersiz müşteri kodunuz : <strong style="color:#6b6785;">NFX5</strong></span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:820}}">
const SAMPLE = [
  ['Merhaba, implant fiyatları hakkında bilgi alabilir miyim?', 'in'],
  ['Tabii ki! Size özel bir teklif hazırlayabiliriz. Kaç dişiniz için düşünüyorsunuz?', 'out'],
  ['Alt çenede 3 diş eksik.', 'in'],
  ['Anladım. Ücretsiz konsültasyon için sizi kliniğimize davet ediyoruz. Uygun olduğunuz bir gün var mı?', 'out'],
  ['Bu hafta perşembe uygun.', 'in']
];
class Component extends DCLogic {
  state = { ready: false, active: 0, msgKey: 0, extra: {} };
  _msg = '';
  componentDidMount() { window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  renderVals() {
    if (!this.state.ready) return { convs: [], hasActive: false };
    const list = window.Nefalix.getDanisan({ size: 10 }).rows;
    const times = ['14:32', '13:10', '11:48', 'Dün', 'Dün', 'Pzt', 'Pzt', 'Paz'];
    const lasts = ['Bu hafta perşembe uygun.', 'Teşekkürler, görüşmek üzere!', 'Fiyat listesi elinize ulaştı mı?', 'Randevumu onaylıyorum.', 'İyi günler dilerim.', 'Tamamdır 👍', 'Bilgi için teşekkürler', 'Merhaba'];
    const convs = list.map((d, i) => ({
      ad: d['Ad'] || '(İsimsiz)', tel: d['Telefon'] || '', initial: (d['Ad'] || '?').trim().charAt(0).toUpperCase(),
      time: times[i % times.length], last: lasts[i % lasts.length], unread: i < 2, unreadCount: i === 0 ? 3 : 1,
      pick: () => this.setState({ active: i, msgKey: this.state.msgKey + 1 }),
      style: { display: 'flex', alignItems: 'center', gap: '11px', padding: '12px 16px', borderBottom: '1px solid #f6f5fb', cursor: 'pointer', background: this.state.active === i ? '#f4f2fb' : '#fff' }
    }));
    const cur = list[this.state.active] || list[0];
    const base = SAMPLE.slice();
    (this.state.extra[this.state.active] || []).forEach(t => base.push([t, 'out']));
    const messages = base.map(([text, dir]) => ({
      text, wrapStyle: { display: 'flex', justifyContent: dir === 'out' ? 'flex-end' : 'flex-start' },
      bubbleStyle: { maxWidth: '70%', background: dir === 'out' ? '#dcf8c6' : '#fff', color: '#1f2937', fontSize: '13.5px', padding: '9px 13px 18px', borderRadius: '10px', position: 'relative', boxShadow: '0 1px 1px rgba(0,0,0,0.08)', lineHeight: '1.4' },
      timeStyle: { position: 'absolute', bottom: '4px', right: '10px', fontSize: '10px', color: '#8b9aa0' }, time: '14:3' + (Math.floor(Math.random() * 9))
    }));
    return {
      ready: true, convs, hasActive: true,
      active: { ad: cur['Ad'] || '(İsimsiz)', tel: cur['Telefon'] || '', initial: (cur['Ad'] || '?').trim().charAt(0).toUpperCase(), href: 'HastaKarti.dc.html?id=' + encodeURIComponent(cur._id) },
      messages, msgKey: this.state.msgKey,
      onMsg: (e) => { this._msg = e.target.value; }, onKey: (e) => { if (e.key === 'Enter') this.doSend(); },
      send: () => this.doSend()
    };
  }
  doSend() {
    const t = (this._msg || '').trim(); if (!t) return;
    const ex = Object.assign({}, this.state.extra);
    ex[this.state.active] = (ex[this.state.active] || []).concat(t);
    this._msg = '';
    this.setState({ extra: ex, msgKey: this.state.msgKey + 1 });
  }
}
</script>
</body>
</html>
