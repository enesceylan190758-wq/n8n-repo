      <div style="font-size:19px; font-weight:800; letter-spacing:0.3px;">Nefalix CRM</div>

<script type="text/x-dc" data-dc-script="">const PAGES = ['Login','Dashboard','HastaKarti','DanisanListesi','YeniDanisan','YeniLead','LeadListesi','DinamikArama','DinamikAramaHavuz','Salesline','SonYapilanIslemler','YeniRandevu','RandevuTakvim','TransferTakvim','RandevuListe','YeniSatis','Kasa','SatisListesi','BakiyeListesi','BankaOzet','GelirlerListe','GiderKaydet','Giderler','Raporlar','YeniTeklif','Teklifler','NotlarGorevler','Faturalar','FirmaListesi','WhatsappPanel','Yetki','Ayarlar','Personel','Hizmet','Paket','Urun','Destek'];
class Component extends DCLogic {
  state = { route: '', booted: false };
  componentDidMount() {
    this._onHash = () => this._sync(false);
    window.addEventListener('hashchange', this._onHash);
    this._boot();
  }
  componentWillUnmount() { if (this._onHash) window.removeEventListener('hashchange', this._onHash); }
  _boot() {
    const run = () => {
      const N = window.Nefalix;
      if (!N) { setTimeout(run, 20); return; }
      if (N.readyLocal) N.readyLocal();
      if (N.currentUser && N.currentUser()) {
        this._applyRoute(true);
        if (N.syncInBackground) N.syncInBackground();
        else if (N.ready) Promise.resolve(N.ready()).catch(() => {});
        return;
      }
      const after = () => {
        this._applyRoute(true);
        if (N.syncInBackground) N.syncInBackground();
      };
      if (N.restoreServerSession) {
        Promise.race([N.restoreServerSession(), new Promise((res) => setTimeout(res, 1200))]).then(after).catch(after);
      } else { after(); }
    };
    run();
  }
  _sync(fromBoot) {
    const N = window.Nefalix;
    if (!N) return;
    if (fromBoot && !(N.currentUser && N.currentUser()) && N.restoreServerSession) {
      N.restoreServerSession().then(() => this._applyRoute(true));
      return;
    }
    this._applyRoute(fromBoot);
  }
  _applyRoute(fromBoot) {
    const N = window.Nefalix;
    const authed = !!(N && N.currentUser && N.currentUser());
    let page = (N && N.currentPage) ? N.currentPage('') : '';
    const hashEmpty = !(location.hash || '').replace(/^#/, '').trim();
    if (authed) {
      if (hashEmpty || !page || PAGES.indexOf(page) < 0 || page === 'Login') {
        const resume = (N.resumeRoute && N.resumeRoute('Dashboard')) || 'Dashboard';
        const resumePage = String(resume).split('?')[0];
        if (PAGES.indexOf(resumePage) >= 0 && resumePage !== 'Login') {
          if (location.hash !== '#' + resume) { location.hash = '#' + resume; return; }
          page = resumePage;
        } else {
          page = 'Dashboard';
          if (location.hash !== '#Dashboard') { location.hash = '#Dashboard'; return; }
        }
      }
      if (N.saveLastRoute) N.saveLastRoute(location.hash);
      this.setState({ route: page, booted: true });
      return;
    }
    if (page !== 'Login') { location.hash = '#Login'; return; }
    this.setState({ route: 'Login', booted: true });
  }
  renderVals() {
    const N = window.Nefalix;
    const page = this.state.route;
    const vals = { booting: !this.state.booted, hkKey: (N && N.param && N.param('id')) || 'none' };
    PAGES.forEach(p => { vals['p_' + p] = (this.state.booted && page === p); });
    return vals;
  }
}
</script>
