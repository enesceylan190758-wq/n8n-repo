<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-lead:hover { background:#f4f2fb !important; }
  .nf-scroll::-webkit-scrollbar { height:10px; }
  .nf-scroll::-webkit-scrollbar-thumb { background:#d5d0ee; border-radius:6px; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="crm" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:20px 28px 30px;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
      <div style="width:40px; height:40px; border-radius:9px; background:#4338ca; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="7" y1="12" x2="20" y2="12"></line><line x1="10" y1="18" x2="20" y2="18"></line></svg></div>
      <span style="font-size:18px; font-weight:700; color:#241854;">Salesline</span>
      <span style="font-size:13px; color:#8b87a8;">— Segmentlere göre lead dağılımı</span>
    </div>
    <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div style="padding:60px; text-align:center; color:#8b87a8;">Yükleniyor...</div></sc-if>
    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
      <div class="nf-scroll" style="display:flex; gap:18px; overflow-x:auto; padding-bottom:14px; align-items:flex-start;">
        <sc-for list="{{ cols }}" as="c" hint-placeholder-count="5">
          <div style="flex:0 0 320px; background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden;">
            <div style="{{ c.headStyle }}">
              <div style="font-size:14px; font-weight:700; color:#fff;">{{ c.key }}</div>
              <div style="display:flex; gap:8px; margin-top:10px;">
                <span style="background:rgba(255,255,255,0.22); color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px;">👥 {{ c.count }}</span>
                <span style="background:rgba(255,255,255,0.22); color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px;">% {{ c.pct }}</span>
              </div>
            </div>
            <div style="padding:10px; max-height:560px; overflow-y:auto;">
              <sc-for list="{{ c.items }}" as="it" hint-placeholder-count="4">
                <a href="{{ it.href }}" class="nf-lead" style="display:block; padding:11px 12px; border-radius:9px; border:1px solid #f0eef8; margin-bottom:8px;">
                  <div style="display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:#241854;"><span>{{ it.flag }}</span>{{ it.ad }}</div>
                  <div style="font-size:11.5px; color:#8b87a8; margin-top:3px;">{{ it.tel }}</div>
                  <div style="font-size:11px; color:#9c98b8; margin-top:2px;">{{ it.temsilci }}</div>
                </a>
              </sc-for>
              <sc-if value="{{ c.empty }}" hint-placeholder-val="{{ false }}"><div style="padding:24px; text-align:center; color:#c5c1dc; font-size:12.5px;">Bu segmentte kayıt yok</div></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900}}">
const FLAGS = { 'Almanya': '🇩🇪', 'Türkiye': '🇹🇷', 'Avusturya': '🇦🇹', 'Hollanda': '🇳🇱', 'İsviçre': '🇨🇭', 'Fransa': '🇫🇷', 'Belçika': '🇧🇪', 'İngiltere': '🇬🇧' };
const HEADS = ['linear-gradient(135deg,#7c3aed,#4338ca)', 'linear-gradient(135deg,#f59e0b,#d97706)', 'linear-gradient(135deg,#2563eb,#22d3ee)', 'linear-gradient(135deg,#16a34a,#22c55e)', 'linear-gradient(135deg,#ec4899,#be185d)', 'linear-gradient(135deg,#0891b2,#0e7490)', 'linear-gradient(135deg,#64748b,#475569)'];
class Component extends DCLogic {
  state = { ready: false };
  componentDidMount() { window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  renderVals() {
    if (!this.state.ready) return { loading: true, ready: false };
    const segs = window.Nefalix.salesSegments();
    const cols = segs.map((s, i) => ({
      key: s.key, count: s.count, pct: s.pct.toFixed(2),
      headStyle: { padding: '16px 18px', background: HEADS[i % HEADS.length] },
      empty: s.items.length === 0,
      items: s.items.slice(0, 40).map(d => ({ ad: d['Ad'] || '(İsimsiz)', tel: d['Telefon'] || '-', temsilci: d['Satış temsilcisi'] ? '👤 ' + d['Satış temsilcisi'] : 'Atanmadı', flag: FLAGS[d['Ülke']] || '🌍', href: 'HastaKarti.dc.html?id=' + encodeURIComponent(d._id) }))
    }));
    return { ready: true, loading: false, cols };
  }
}
</script>
</body>
</html>
