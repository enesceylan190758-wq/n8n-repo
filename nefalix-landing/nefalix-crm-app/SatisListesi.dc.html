<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-row:hover { background:#f3f1fb !important; }
  .nf-btn:hover { filter:brightness(1.07); }
  .nf-input:focus { border-color:#7c3aed !important; box-shadow:0 0 0 3px rgba(124,58,237,0.12) !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="gelirler" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:22px 28px 30px;">
    <div style="background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden;">
      <div style="padding:18px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f0eef8;">
        <div style="font-size:17px; font-weight:700; color:#241854;">{{ title }}</div>
        <div style="display:flex; gap:8px; align-items:center;">
        <div class="nf-btn" onClick="{{ doExcel }}" style="background:#16a34a; border-radius:9px; padding:9px 13px; font-size:12.5px; font-weight:600; color:#fff; cursor:pointer;">⬇ Excel</div>
        <div class="nf-btn" onClick="{{ doPdf }}" style="background:#dc2626; border-radius:9px; padding:9px 13px; font-size:12.5px; font-weight:600; color:#fff; cursor:pointer;">⬇ PDF</div>
        <span style="font-size:13px; font-weight:600; color:#16a34a; background:#dcfce7; padding:6px 14px; border-radius:20px;">Toplam: {{ totalLabel }}</span>
        </div>
      </div>
      <div style="padding:14px 24px; border-bottom:1px solid #f0eef8;">
        <div style="display:flex; align-items:center; gap:8px; border:1px solid #d9d5ee; border-radius:9px; padding:9px 13px; max-width:360px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b87a8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input class="nf-input" placeholder="Kurum ara..." onInput="{{ onQ }}" style="border:none; outline:none; font-size:13.5px; color:#241854; width:100%; background:transparent;" />
        </div>
      </div>
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div style="padding:60px; text-align:center; color:#8b87a8;">Yükleniyor...</div></sc-if>
      <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid; grid-template-columns:1fr 1fr 1.6fr 1.4fr 1fr 1fr; padding:13px 24px; background:#fbfaff; font-size:12px; font-weight:700; color:#241854; border-bottom:1px solid #f0eef8;">
          <span>Tarih</span><span>Referans</span><span>Kurum</span><span>Bilgi</span><span>Yöntem</span><span style="text-align:right;">Tutar</span>
        </div>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="16">
          <div class="nf-row" style="{{ r.style }}">
            <span style="color:#4b4770; font-size:12.5px;">{{ r.tarih }}</span>
            <span style="color:#8b87a8; font-size:12px;">{{ r.ref }}</span>
            <div style="min-width:0;">
              <sc-if value="{{ r.linked }}" hint-placeholder-val="{{ false }}"><a href="{{ r.href }}" style="color:#241854; font-weight:600; font-size:13px;">{{ r.ad }}</a></sc-if>
              <sc-if value="{{ r.notLinked }}" hint-placeholder-val="{{ true }}"><span style="color:#241854; font-weight:600; font-size:13px;">{{ r.ad }}</span></sc-if>
            </div>
            <span style="color:#4b4770; font-size:12px;">{{ r.bilgi }}</span>
            <span style="color:#4b4770; font-size:12px;">{{ r.yontem }}</span>
            <span style="text-align:right; font-weight:700; font-size:13px; color:#16a34a;">{{ r.tutar }}</span>
          </div>
        </sc-for>
        <div style="padding:16px 24px; font-size:13px; color:#8b87a8;">{{ countLabel }}</div>
      </sc-if>
    </div>
  </div>
  <div style="padding:16px 28px; display:flex; justify-content:space-between; font-size:12px; color:#9c98b8;"><span>Nefalix 2026 © <strong style="color:#6b6785;">v160726_01</strong></span><span>Benzersiz müşteri kodunuz : <strong style="color:#6b6785;">NFX5</strong></span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;satis&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;satis&quot;,&quot;gelir&quot;]}}">
function money(v, kur) { const n = Math.abs(parseFloat(v) || 0); return n.toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ' + (kur || 'TRY'); }
class Component extends DCLogic {
  state = { ready: false, q: '' };
  componentDidMount() { window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  renderVals() {
    const title = this.props.mode === 'gelir' ? 'Gelirler' : 'Satış Listesi';
    if (!this.state.ready) return { loading: true, ready: false, title };
    let list = window.Nefalix.getGelir();
    const q = this.state.q.toLowerCase().trim();
    if (q) list = list.filter(k => String(k['Danışan / Firma'] || k['Danışan'] || '').toLowerCase().includes(q));
    let totTRY = 0, totEUR = 0;
    list.forEach(k => { const v = parseFloat(k['Tutar']) || 0; if ((k['Kur'] || 'TRY') === 'EUR') totEUR += v; else totTRY += v; });
    const rows = list.slice(0, 200).map((k, i) => {
      const ad = k['Danışan / Firma'] || k['Danışan'] || '-';
      const href = window.Nefalix.hrefForName(ad);
      return {
      tarih: k['Ödeme tarihi'] || '-', ref: k['Referans kodu'] || '-',
      ad, href: href || '#', linked: !!href, notLinked: !href, bilgi: k['Bilgi'] || '-',
      yontem: k['Ödeme Yöntemi'] || '-', tutar: money(k['Tutar'], k['Kur']),
      style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1.6fr 1.4fr 1fr 1fr', alignItems: 'center', padding: '12px 24px', borderBottom: '1px solid #f6f5fb', background: i % 2 === 0 ? '#fff' : '#fbfaff' }
      };
    });
    return {
      ready: true, loading: false, rows, title,
      totalLabel: money(totTRY, 'TRY') + (totEUR ? ' + ' + money(totEUR, 'EUR') : ''),
      countLabel: list.length + ' kayıt gösteriliyor.',
      onQ: (e) => this.setState({ q: e.target.value }),
      doExcel: () => this.exp('excel', list, title), doPdf: () => this.exp('pdf', list, title)
    };
  }
  exp(kind, list, title) {
    const headers = ['Tarih', 'Referans', 'Danışan', 'Bilgi', 'Yöntem', 'Tutar', 'Kur'];
    const rows = list.map(k => [k['Ödeme tarihi'] || '', k['Referans kodu'] || '', k['Danışan / Firma'] || k['Danışan'] || '', k['Bilgi'] || '', k['Ödeme Yöntemi'] || '', parseFloat(k['Tutar']) || 0, k['Kur'] || 'TRY']);
    if (kind === 'excel') window.Nefalix.exportExcel(title.toLowerCase().replace(/\s+/g, '-'), headers, rows);
    else window.Nefalix.exportPDF(title, headers, rows);
  }
}
</script>
</body>
</html>
