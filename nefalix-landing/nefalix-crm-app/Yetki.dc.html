<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-row:hover { background:#f3f1fb !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="sistem" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:22px 28px 30px;">
    <div style="background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden;">
      <div style="padding:18px 24px; font-size:17px; font-weight:700; color:#241854; border-bottom:1px solid #f0eef8;">🔐 Yetki & Roller</div>
      <div style="display:grid; grid-template-columns:1.4fr repeat(6, 1fr); padding:13px 24px; background:#fbfaff; font-size:11.5px; font-weight:700; color:#241854; border-bottom:1px solid #f0eef8;">
        <span>Rol / Modül</span><span style="text-align:center;">CRM</span><span style="text-align:center;">Kurum</span><span style="text-align:center;">Randevu</span><span style="text-align:center;">Gelir/Gider</span><span style="text-align:center;">Rapor</span><span style="text-align:center;">Sistem</span>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <div class="nf-row" style="{{ r.style }}">
          <span style="font-size:13px; font-weight:600; color:#241854;">{{ r.rol }}</span>
          <sc-for list="{{ r.perms }}" as="p" hint-placeholder-count="6"><span style="display:flex; justify-content:center;"><span style="{{ p.style }}">{{ p.icon }}</span></span></sc-for>
        </div>
      </sc-for>
      <div style="padding:16px 24px; font-size:12.5px; color:#8b87a8;">✓ Tam yetki &nbsp;·&nbsp; ◐ Sadece görüntüleme &nbsp;·&nbsp; ✕ Erişim yok</div>
    </div>
  </div>
  <div style="padding:16px 28px; display:flex; justify-content:space-between; font-size:12px; color:#9c98b8;"><span>Nefalix 2026 © <strong style="color:#6b6785;">v160726_01</strong></span><span>Benzersiz müşteri kodunuz : <strong style="color:#6b6785;">NFX5</strong></span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:500}}">
const ROLES = [
  { rol: 'Yönetici', perms: [2, 2, 2, 2, 2, 2] },
  { rol: 'Hekim', perms: [1, 2, 2, 0, 1, 0] },
  { rol: 'Satış Temsilcisi', perms: [2, 2, 2, 1, 1, 0] },
  { rol: 'Hasta Koordinatörü', perms: [2, 2, 2, 0, 0, 0] },
  { rol: 'Muhasebe', perms: [0, 1, 0, 2, 2, 0] }
];
const P = { 2: { icon: '✓', color: '#16a34a', bg: '#dcfce7' }, 1: { icon: '◐', color: '#f59e0b', bg: '#fef3c7' }, 0: { icon: '✕', color: '#dc2626', bg: '#fee2e2' } };
class Component extends DCLogic {
  renderVals() {
    const rows = ROLES.map((r, i) => ({
      rol: r.rol,
      perms: r.perms.map(v => ({ icon: P[v].icon, style: { width: '26px', height: '26px', borderRadius: '7px', background: P[v].bg, color: P[v].color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '13px', fontWeight: 700 } })),
      style: { display: 'grid', gridTemplateColumns: '1.4fr repeat(6, 1fr)', alignItems: 'center', padding: '13px 24px', borderBottom: '1px solid #f6f5fb', background: i % 2 === 0 ? '#fff' : '#fbfaff' }
    }));
    return { rows };
  }
}
</script>
</body>
</html>
