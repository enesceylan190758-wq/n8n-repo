<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-btn:hover { filter:brightness(1.07); }
  .nf-f:focus { border-color:#7c3aed !important; box-shadow:0 0 0 3px rgba(124,58,237,0.12) !important; }
  .nf-task:hover { background:#f9f8fd !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="kurum" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:22px 28px 30px; max-width:900px; margin:0 auto; width:100%; box-sizing:border-box;">
    <div style="background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden;">
      <div style="padding:18px 24px; font-size:17px; font-weight:700; color:#241854; border-bottom:1px solid #f0eef8;">📝 Notlar & Görevler</div>
      <div style="padding:16px 24px; border-bottom:1px solid #f0eef8; display:flex; gap:10px;">
        <input class="nf-f" key="{{ inputKey }}" placeholder="Yeni görev ekle..." onInput="{{ onIn }}" onKeyDown="{{ onKey }}" style="flex:1; box-sizing:border-box; padding:11px 14px; border:1px solid #d9d5ee; border-radius:9px; font-size:13.5px; outline:none;" />
        <select onChange="{{ onOncelik }}" style="border:1px solid #d9d5ee; border-radius:9px; padding:9px 13px; font-size:13px; color:#4b4770; background:#fff; cursor:pointer;"><option>Orta</option><option>Yüksek</option><option>Düşük</option></select>
        <div class="nf-btn" onClick="{{ add }}" style="background:linear-gradient(135deg,#7c3aed,#2563eb); border-radius:9px; padding:11px 22px; font-size:13.5px; font-weight:700; color:#fff; cursor:pointer;">Ekle</div>
      </div>
      <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <div class="nf-task" style="display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid #f6f5fb;">
            <div onClick="{{ r.toggle }}" style="{{ r.checkStyle }}"><sc-if value="{{ r.done }}" hint-placeholder-val="{{ false }}"><span style="color:#fff; font-size:13px;">✓</span></sc-if></div>
            <div style="flex:1;"><div style="{{ r.titleStyle }}">{{ r.baslik }}</div><div style="font-size:11.5px; color:#9c98b8; margin-top:2px;">{{ r.tip }} · {{ r.tarih }}</div></div>
            <span style="{{ r.oncelikStyle }}">{{ r.oncelik }}</span>
          </div>
        </sc-for>
        <div style="padding:16px 24px; font-size:13px; color:#8b87a8;">{{ countLabel }}</div>
      </sc-if>
    </div>
  </div>
  <div style="padding:16px 28px; display:flex; justify-content:space-between; font-size:12px; color:#9c98b8;"><span>Nefalix 2026 © <strong style="color:#6b6785;">v160726_01</strong></span><span>Benzersiz müşteri kodunuz : <strong style="color:#6b6785;">NFX5</strong></span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:600}}">
const OC = { 'Düşük': ['#16a34a', '#dcfce7'], 'Orta': ['#f59e0b', '#fef3c7'], 'Yüksek': ['#dc2626', '#fee2e2'] };
class Component extends DCLogic {
  state = { ready: false, ver: 0, inputKey: 0 };
  _title = ''; _oncelik = 'Orta';
  componentDidMount() { window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  add() { const t = (this._title || '').trim(); if (!t) return; window.Nefalix.addGorev({ baslik: t, oncelik: this._oncelik }); this._title = ''; this.setState(s => ({ ver: s.ver + 1, inputKey: s.inputKey + 1 })); }
  renderVals() {
    const base = {
      inputKey: this.state.inputKey,
      onIn: (e) => { this._title = e.target.value; }, onOncelik: (e) => { this._oncelik = e.target.value; },
      onKey: (e) => { if (e.key === 'Enter') this.add(); }, add: () => this.add()
    };
    if (!this.state.ready) return Object.assign(base, { ready: false, rows: [] });
    const list = window.Nefalix.getGorevler();
    const rows = list.map(g => {
      const oc = OC[g.oncelik] || OC['Orta'];
      return {
        baslik: g.baslik, tip: g.tip, tarih: g.tarih, oncelik: g.oncelik, done: g.done,
        toggle: () => { window.Nefalix.toggleGorev(g._id); this.setState(s => ({ ver: s.ver + 1 })); },
        checkStyle: { width: '22px', height: '22px', borderRadius: '6px', border: g.done ? 'none' : '2px solid #d9d5ee', background: g.done ? '#16a34a' : '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0 },
        titleStyle: { fontSize: '13.5px', fontWeight: 600, color: g.done ? '#9c98b8' : '#241854', textDecoration: g.done ? 'line-through' : 'none' },
        oncelikStyle: { fontSize: '11.5px', fontWeight: 600, padding: '3px 10px', borderRadius: '20px', color: oc[0], background: oc[1] }
      };
    });
    const open = list.filter(g => !g.done).length;
    return Object.assign(base, { ready: true, rows, countLabel: list.length + ' görev · ' + open + ' açık' });
  }
}
</script>
</body>
</html>
