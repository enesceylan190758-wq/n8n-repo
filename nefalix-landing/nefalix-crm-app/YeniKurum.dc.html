<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-btn:hover { filter:brightness(1.07); }
  .nf-f:focus { border-color:#7c3aed !important; box-shadow:0 0 0 3px rgba(124,58,237,0.12) !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9;">
  <dc-import name="NavHeader" active-page="kurum" hint-size="100%,132px"></dc-import>

  <div style="max-width:1180px; margin:0 auto; padding:22px 28px 60px;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <a href="KurumListesi.dc.html" style="width:34px; height:34px; border-radius:8px; background:#fff; border:1px solid #e6e2f5; display:flex; align-items:center; justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4338ca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
      <span style="font-size:18px; font-weight:700; color:#241854;">Yeni Kurum / Klinik</span>
    </div>

    <sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}">
      <div style="background:#dcfce7; border:1px solid #86efac; color:#15803d; font-size:13.5px; border-radius:10px; padding:13px 16px; margin-bottom:16px; display:flex; align-items:center; gap:9px;">✓ Kurum kaydedildi. <a href="{{ savedHref }}" style="color:#15803d; font-weight:700;">Kartı aç →</a></div>
    </sc-if>

    <div style="background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden;">
      <div style="background:linear-gradient(135deg,#7c3aed,#4338ca); color:#fff; padding:13px 22px; font-size:14px; font-weight:700;">🏢 Kurum & Yetkili Bilgileri</div>
      <div style="padding:22px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px 20px;">
        <div><label style="{{ lbl }}">Kurum Adı *</label><input class="nf-f" data-k="Ad" onInput="{{ onIn }}" placeholder="Örn: Estetika Güzellik Merkezi" style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">Kurum Tipi</label><select class="nf-f" data-k="Kurum tipi" onChange="{{ onIn }}" style="{{ inp }}"><option value="">Seçiniz</option><option>Diş Kliniği</option><option>Estetik / Güzellik Merkezi</option><option>Saç Ekim Merkezi</option><option>Hastane</option><option>Göz Merkezi</option><option>Poliklinik</option><option>Fizik Tedavi / Rehabilitasyon</option><option>Diğer</option></select></div>
        <div><label style="{{ lbl }}">Telefon *</label><input class="nf-f" data-k="Telefon" onInput="{{ onIn }}" placeholder="+90 5..." style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">Yetkili Kişi</label><input class="nf-f" data-k="Yetkili" onInput="{{ onIn }}" placeholder="Örn: Dr. Ayşe Kaya" style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">Ünvan</label><input class="nf-f" data-k="Ünvan" onInput="{{ onIn }}" placeholder="Klinik Sahibi / Başhekim..." style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">E-Posta</label><input class="nf-f" data-k="E-Posta" onInput="{{ onIn }}" style="{{ inp }}" /></div>
      </div>

      <div style="background:linear-gradient(135deg,#2563eb,#22d3ee); color:#fff; padding:13px 22px; font-size:14px; font-weight:700;">📍 Adres & İletişim</div>
      <div style="padding:22px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px 20px;">
        <div><label style="{{ lbl }}">Şehir</label><input class="nf-f" data-k="Şehir" onInput="{{ onIn }}" placeholder="İstanbul" style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">İlçe</label><input class="nf-f" data-k="İlçe" onInput="{{ onIn }}" style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">Web / Instagram</label><input class="nf-f" data-k="Web" onInput="{{ onIn }}" placeholder="@klinik" style="{{ inp }}" /></div>
        <div style="grid-column:1 / 3;"><label style="{{ lbl }}">Açık Adres</label><input class="nf-f" data-k="Adres" onInput="{{ onIn }}" style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">Hekim / Koltuk Sayısı</label><input class="nf-f" data-k="Hekim sayısı" onInput="{{ onIn }}" style="{{ inp }}" /></div>
      </div>

      <div style="background:#241854; color:#fff; padding:13px 22px; font-size:14px; font-weight:700;">🗂 CRM & Diğer</div>
      <div style="padding:22px;">
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px 20px; margin-bottom:16px;">
          <div><label style="{{ lbl }}">Aşama</label><select class="nf-f" data-k="Segment" onChange="{{ onIn }}" style="{{ inp }}"><option>Yeni Lead</option><option>İlk Görüşme</option><option>Demo</option><option>Teklif</option><option>Sözleşme</option><option>Aktif Müşteri</option></select></div>
          <div><label style="{{ lbl }}">Referans Kaynağı (nasıl ulaşıldı)</label><select class="nf-f" data-k="Referans kaynağı" onChange="{{ onIn }}" style="{{ inp }}"><option value="">Seçiniz</option><option>Instagram</option><option>Saha ziyareti</option><option>Dental Fuarı</option><option>Tavsiye</option><option>Web sitesi</option><option>Soğuk arama</option><option>LinkedIn</option></select></div>
          <div><label style="{{ lbl }}">Vergi Dairesi / No</label><input class="nf-f" data-k="Vergi no" onInput="{{ onIn }}" style="{{ inp }}" /></div>
          <div><label style="{{ lbl }}">Satış Temsilcisi</label><select class="nf-f" data-k="Satış temsilcisi" onChange="{{ onIn }}" style="{{ inp }}"><option value="">Seçiniz</option><sc-for list="{{ reps }}" as="r" hint-placeholder-count="3"><option>{{ r }}</option></sc-for></select></div>
        </div>
        <div><label style="{{ lbl }}">İlk not / görüşme özeti</label><textarea class="nf-f" data-k="Son müşteri notu" onInput="{{ onIn }}" style="{{ inp }} min-height:80px; resize:vertical; font-family:inherit;"></textarea></div>
      </div>

      <div style="padding:0 22px 22px; display:flex; justify-content:flex-end; gap:12px;">
        <a href="KurumListesi.dc.html" style="padding:12px 22px; border-radius:9px; border:1px solid #d9d5ee; font-size:13.5px; color:#4b4770; font-weight:600;">Vazgeç</a>
        <div class="nf-btn" onClick="{{ save }}" style="background:linear-gradient(135deg,#7c3aed,#2563eb); border-radius:9px; padding:12px 28px; font-size:13.5px; font-weight:700; color:#fff; cursor:pointer;">Kurumu Kaydet</div>
      </div>
    </div>
    <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}"><div style="margin-top:14px; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; font-size:13px; border-radius:9px; padding:11px 14px;">{{ err }}</div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  state = { ready: false, saved: false, savedHref: '', err: '' };
  form = { 'Segment': 'Yeni Lead', 'Kurum tipi': 'Diş Kliniği' };
  componentDidMount() { window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  renderVals() {
    const lbl = 'display:block; font-size:12px; font-weight:600; color:#4b4770; margin-bottom:6px;';
    const inp = 'width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #d9d5ee; border-radius:9px; font-size:13.5px; color:#241854; outline:none; background:#fff; transition:box-shadow .15s,border-color .15s;';
    let reps = [];
    if (this.state.ready) {
      const seen = {}; window.Nefalix.getKurum({ size: 400 }).rows.forEach(d => { const t = d['Satış temsilcisi']; if (t && !seen[t]) seen[t] = 1; });
      reps = Object.keys(seen).slice(0, 12);
      if (!reps.length) reps = ['Enes Ceylan', 'Abdülkadir Yaşar', 'Zeynep Aksoy', 'Burak Demir'];
    }
    return {
      lbl, inp, reps,
      saved: this.state.saved, savedHref: this.state.savedHref, err: this.state.err,
      onIn: (e) => { this.form[e.target.getAttribute('data-k')] = e.target.value; },
      save: () => {
        if (!this.form['Ad'] || !this.form['Telefon']) { this.setState({ err: 'Kurum Adı ve Telefon zorunludur.' }); return; }
        const rec = window.Nefalix.addKurum(this.form);
        this.setState({ saved: true, savedHref: 'KurumKarti.dc.html?id=' + encodeURIComponent(rec._id), err: '' });
        window.scrollTo(0, 0);
      }
    };
  }
}
</script>
</body>
</html>
