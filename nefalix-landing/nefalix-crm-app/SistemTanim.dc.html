<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-row:hover { background:#f3f1fb !important; }
  .nf-btn:hover { filter:brightness(1.07); }
  .nf-f:focus { border-color:#7c3aed !important; box-shadow:0 0 0 3px rgba(124,58,237,0.12) !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="sistem" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:22px 28px 30px;">
    <div style="background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden;">
      <div style="padding:18px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f0eef8;">
        <div style="display:flex; align-items:center; gap:10px;"><span style="font-size:22px;">{{ icon }}</span><span style="font-size:17px; font-weight:700; color:#241854;">{{ title }}</span></div>
        <div style="display:flex; gap:8px;">
        <div class="nf-btn" onClick="{{ doExcel }}" style="background:#16a34a; border-radius:9px; padding:10px 14px; font-size:12.5px; font-weight:600; color:#fff; cursor:pointer;">⬇ Excel</div>
        <div class="nf-btn" onClick="{{ doPdf }}" style="background:#dc2626; border-radius:9px; padding:10px 14px; font-size:12.5px; font-weight:600; color:#fff; cursor:pointer;">⬇ PDF</div>
        <div class="nf-btn" onClick="{{ openForm }}" style="background:linear-gradient(135deg,#7c3aed,#4338ca); border-radius:9px; padding:10px 16px; font-size:13px; font-weight:600; color:#fff; cursor:pointer;">＋ {{ addLabel }}</div>
        </div>
      </div>

      <sc-if value="{{ showForm }}" hint-placeholder-val="{{ false }}">
        <div style="padding:18px 24px; background:#faf9fe; border-bottom:1px solid #f0eef8;">
          <div style="display:grid; grid-template-columns:repeat({{ colCount }}, 1fr); gap:12px; align-items:end;">
            <sc-for list="{{ cols }}" as="c" hint-placeholder-count="4">
              <div><label style="display:block; font-size:11.5px; font-weight:600; color:#4b4770; margin-bottom:5px;">{{ c.label }}</label><input class="nf-f" data-k="{{ c.key }}" onInput="{{ onIn }}" style="width:100%; box-sizing:border-box; padding:9px 11px; border:1px solid #d9d5ee; border-radius:8px; font-size:13px; outline:none;" /></div>
            </sc-for>
          </div>
          <div style="display:flex; gap:10px; margin-top:14px;">
            <div class="nf-btn" onClick="{{ save }}" style="background:#16a34a; border-radius:8px; padding:9px 18px; font-size:13px; font-weight:600; color:#fff; cursor:pointer;">Kaydet</div>
            <div class="nf-btn" onClick="{{ closeForm }}" style="background:#f4f2fb; border-radius:8px; padding:9px 18px; font-size:13px; font-weight:600; color:#4b4770; cursor:pointer;">İptal</div>
          </div>
        </div>
      </sc-if>

      <div style="{{ headStyle }}">
        <sc-for list="{{ cols }}" as="c" hint-placeholder-count="4"><span style="font-size:12px; font-weight:700; color:#241854;">{{ c.label }}</span></sc-for>
      </div>
      <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
          <div class="nf-row" style="{{ r.style }}">
            <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="4"><span style="{{ c.style }}">{{ c.value }}</span></sc-for>
          </div>
        </sc-for>
        <div style="padding:16px 24px; font-size:13px; color:#8b87a8;">{{ countLabel }}</div>
      </sc-if>
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div style="padding:50px; text-align:center; color:#8b87a8;">Yükleniyor...</div></sc-if>
    </div>
  </div>
  <div style="padding:16px 28px; display:flex; justify-content:space-between; font-size:12px; color:#9c98b8;"><span>Nefalix 2026 © <strong style="color:#6b6785;">v160726_01</strong></span><span>Benzersiz müşteri kodunuz : <strong style="color:#6b6785;">NFX5</strong></span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:700},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;personel&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;personel&quot;,&quot;hizmet&quot;,&quot;paket&quot;,&quot;urun&quot;]}}">
const CONFIG = {
  personel: { title: 'Personel', icon: '👥', add: 'Yeni Personel', cols: [{ key: 'ad', label: 'Ad Soyad' }, { key: 'rol', label: 'Rol' }, { key: 'tel', label: 'Telefon' }, { key: 'email', label: 'E-Posta' }, { key: 'durum', label: 'Durum' }] },
  hizmet: { title: 'Hizmet', icon: '🦷', add: 'Yeni Hizmet', cols: [{ key: 'ad', label: 'Hizmet Adı' }, { key: 'kategori', label: 'Kategori' }, { key: 'sure', label: 'Süre' }, { key: 'fiyat', label: 'Fiyat' }] },
  paket: { title: 'Paket', icon: '📦', add: 'Yeni Paket', cols: [{ key: 'ad', label: 'Paket Adı' }, { key: 'icerik', label: 'İçerik' }, { key: 'fiyat', label: 'Fiyat' }, { key: 'durum', label: 'Durum' }] },
  urun: { title: 'Ürün', icon: '🧴', add: 'Yeni Ürün', cols: [{ key: 'ad', label: 'Ürün Adı' }, { key: 'kod', label: 'Stok Kodu' }, { key: 'stok', label: 'Stok' }, { key: 'birim', label: 'Birim' }] }
};
class Component extends DCLogic {
  state = { ready: false, showForm: false, ver: 0 };
  form = {};
  componentDidMount() { window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  renderVals() {
    const kind = this.props.kind || 'personel';
    const cfg = CONFIG[kind] || CONFIG.personel;
    const colCount = cfg.cols.length;
    const gridCols = kind === 'hizmet' ? '1.6fr 1fr 0.8fr 0.9fr' : kind === 'urun' ? '1.6fr 1fr 0.7fr 0.7fr' : kind === 'paket' ? '1.4fr 2fr 1fr 0.8fr' : '1.4fr 1.1fr 1.1fr 1.4fr 0.8fr';
    const headStyle = { display: 'grid', gridTemplateColumns: gridCols, gap: '10px', padding: '13px 24px', background: '#fbfaff', borderBottom: '1px solid #f0eef8' };
    const base = { title: cfg.title, icon: cfg.icon, addLabel: cfg.add, cols: cfg.cols, colCount, headStyle,
      showForm: this.state.showForm,
      openForm: () => { this.form = {}; this.setState({ showForm: true }); },
      closeForm: () => this.setState({ showForm: false }),
      onIn: (e) => { this.form[e.target.getAttribute('data-k')] = e.target.value; },
      save: () => { if (Object.keys(this.form).length) window.Nefalix.addDef(kind, Object.assign({}, this.form)); this.setState(s => ({ showForm: false, ver: s.ver + 1 })); },
      doExcel: () => this.exp('excel', kind, cfg), doPdf: () => this.exp('pdf', kind, cfg) };
    if (!this.state.ready) return Object.assign(base, { loading: true, ready: false, rows: [] });
    const data = window.Nefalix.getDefs(kind);
    const rows = data.map((d, i) => ({
      cells: cfg.cols.map(c => {
        const v = d[c.key] || '-';
        let style = { fontSize: '13px', color: '#4b4770' };
        if (c.key === 'ad') style = { fontSize: '13px', color: '#241854', fontWeight: 600 };
        if (c.key === 'durum') style = { fontSize: '11.5px', fontWeight: 600, padding: '3px 10px', borderRadius: '20px', justifySelf: 'start', color: '#16a34a', background: '#dcfce7' };
        if (c.key === 'fiyat') style = { fontSize: '13px', color: '#241854', fontWeight: 700 };
        return { value: v, style };
      }),
      style: { display: 'grid', gridTemplateColumns: gridCols, gap: '10px', alignItems: 'center', padding: '12px 24px', borderBottom: '1px solid #f6f5fb', background: i % 2 === 0 ? '#fff' : '#fbfaff' }
    }));
    return Object.assign(base, { ready: true, loading: false, rows, countLabel: data.length + ' kayıt' });
  }
  exp(kind, defKind, cfg) {
    const data = window.Nefalix.getDefs(defKind);
    const headers = cfg.cols.map(c => c.label);
    const rows = data.map(d => cfg.cols.map(c => d[c.key] || ''));
    if (kind === 'excel') window.Nefalix.exportExcel(cfg.title.toLowerCase(), headers, rows);
    else window.Nefalix.exportPDF(cfg.title, headers, rows);
  }
}
</script>
</body>
</html>
