<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-row:hover { background:#f3f1fb !important; }
  .nf-btn:hover { filter:brightness(1.07); }
  .nf-input:focus { border-color:#7c3aed !important; box-shadow:0 0 0 3px rgba(124,58,237,0.12) !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="crm" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:22px 28px 30px;">
    <div style="background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden;">
      <div style="padding:18px 24px; font-size:17px; font-weight:700; color:#241854; border-bottom:1px solid #f0eef8; display:flex; align-items:center; justify-content:space-between;">
        <span>Dinamik Arama - Havuz</span>
        <div style="display:flex; gap:8px;">
          <div class="nf-btn" onClick="{{ doExcel }}" style="background:#16a34a; border-radius:9px; padding:9px 14px; font-size:12.5px; font-weight:600; color:#fff; cursor:pointer;">⬇ Excel</div>
          <div class="nf-btn" onClick="{{ doPdf }}" style="background:#dc2626; border-radius:9px; padding:9px 14px; font-size:12.5px; font-weight:600; color:#fff; cursor:pointer;">⬇ PDF</div>
        </div>
      </div>
      <div style="padding:16px 24px; display:flex; gap:12px; align-items:center; border-bottom:1px solid #f0eef8;">
        <div style="display:flex; align-items:center; gap:8px; border:1px solid #d9d5ee; border-radius:9px; padding:9px 13px; flex:1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b87a8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input class="nf-input" placeholder="Havuzda ara (ad, telefon, segment)..." onInput="{{ onQ }}" onKeyDown="{{ onKey }}" style="border:none; outline:none; font-size:13.5px; color:#241854; width:100%; background:transparent;" />
        </div>
        <div class="nf-btn" onClick="{{ doSearch }}" style="background:linear-gradient(135deg,#2563eb,#22d3ee); border-radius:9px; padding:10px 20px; font-size:13px; font-weight:600; color:#fff; cursor:pointer;">Ara</div>
      </div>
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div style="padding:60px; text-align:center; color:#8b87a8;">Yükleniyor...</div></sc-if>
      <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid; grid-template-columns:1.3fr 1.1fr 1.3fr 1fr 1.2fr 1.2fr; padding:13px 24px; background:#fbfaff; font-size:12px; font-weight:700; color:#241854; border-bottom:1px solid #f0eef8;">
          <span>Kurum</span><span>Telefon</span><span>Segment</span><span>Sonraki arama</span><span>Satış temsilcisi</span><span>Son not</span>
        </div>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="14">
          <div class="nf-row" style="{{ r.style }}">
            <a href="{{ r.href }}" style="font-weight:600; color:#241854; font-size:13px;">{{ r.flag }} {{ r.ad }}</a>
            <span style="color:#4b4770; font-size:12.5px;">{{ r.tel }}</span>
            <span style="display:flex; align-items:center; gap:7px; font-size:12px; color:#4b4770;"><span style="{{ r.dot }}"></span>{{ r.segment }}</span>
            <span style="{{ r.nextStyle }}">{{ r.next }}</span>
            <span style="color:#4b4770; font-size:12px;">{{ r.temsilci }}</span>
            <span style="color:#8b87a8; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ r.note }}</span>
          </div>
        </sc-for>
        <div style="padding:16px 24px; font-size:13px; color:#8b87a8;">{{ countLabel }}</div>
      </sc-if>
    </div>
  </div>
  <div style="padding:16px 28px; display:flex; justify-content:space-between; font-size:12px; color:#9c98b8;"><span>Nefalix 2026 © <strong style="color:#6b6785;">v160726_01</strong></span><span>Benzersiz müşteri kodunuz : <strong style="color:#6b6785;">NFX5</strong></span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900}}">
const FLAGS = { 'Almanya': '🇩🇪', 'Türkiye': '🇹🇷', 'Avusturya': '🇦🇹', 'Hollanda': '🇳🇱', 'İsviçre': '🇨🇭', 'Fransa': '🇫🇷', 'Belçika': '🇧🇪', 'İngiltere': '🇬🇧' };
function segColor(s) { s = (s || '').toLowerCase(); if (s.includes('ulaşılamadı')) return '#f59e0b'; if (s.includes('sıcak')) return '#ef4444'; if (s.includes('sonra aranacak')) return '#2563eb'; if (s.includes('uzun vade')) return '#7c3aed'; if (s.includes('olumsuz')) return '#9ca3af'; if (s.includes('bilet')) return '#16a34a'; if (s.includes('analiz')) return '#0891b2'; return '#a78bfa'; }
class Component extends DCLogic {
  state = { ready: false, q: '' }; _q = '';
  componentDidMount() { window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  renderVals() {
    if (!this.state.ready) return { loading: true, ready: false };
    let list = window.Nefalix.getDinamik();
    const q = this.state.q.toLowerCase().trim();
    if (q) list = list.filter(d => String(d['Danışan'] || d['Ad'] || '').toLowerCase().includes(q) || String(d['Telefon'] || '').toLowerCase().includes(q) || String(d['Segment'] || '').toLowerCase().includes(q));
    const rows = list.map((d, i) => ({
      ad: d['Danışan'] || d['Ad'] || '(İsimsiz)', tel: d['Telefon'] || '-', segment: d['Segment'] || '-',
      flag: FLAGS[d['Ülke']] || '🏢', temsilci: d['Satış temsilcisi'] || '-', note: d['Notlar'] || '-',
      next: d.nextCallDate || '-', dot: { width: '9px', height: '9px', borderRadius: '50%', background: segColor(d['Segment']), display: 'inline-block', flexShrink: 0 },
      href: 'KurumKarti.dc.html?id=' + encodeURIComponent(d._id || ''),
      nextStyle: { fontSize: '12px', fontWeight: 600, color: d.nextCallDate ? '#2563eb' : '#c5c1dc' },
      style: { display: 'grid', gridTemplateColumns: '1.3fr 1.1fr 1.3fr 1fr 1.2fr 1.2fr', alignItems: 'center', padding: '12px 24px', borderBottom: '1px solid #f6f5fb', background: i % 2 === 0 ? '#fff' : '#fbfaff' }
    }));
    return {
      ready: true, loading: false, rows, countLabel: list.length + ' kayıt gösteriliyor.',
      onQ: (e) => { this._q = e.target.value; }, onKey: (e) => { if (e.key === 'Enter') this.setState({ q: this._q }); },
      doSearch: () => this.setState({ q: this._q }),
      doExcel: () => this.exp('excel', list), doPdf: () => this.exp('pdf', list)
    };
  }
  exp(kind, list) {
    const headers = ['Danışan', 'Telefon', 'Segment', 'Sonraki arama', 'Temsilci', 'Son not'];
    const rows = list.map(d => [d['Danışan'] || d['Ad'] || '', d['Telefon'] || '', d['Segment'] || '', d.nextCallDate || '', d['Satış temsilcisi'] || '', d['Notlar'] || '']);
    if (kind === 'excel') window.Nefalix.exportExcel('dinamik-arama-havuz', headers, rows);
    else window.Nefalix.exportPDF('Dinamik Arama - Havuz', headers, rows);
  }
}
</script>
</body>
</html>
