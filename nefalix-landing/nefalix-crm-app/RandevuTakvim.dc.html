<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-btn:hover { filter:brightness(1.07); }
  .nf-appt:hover { filter:brightness(0.94); }
  .nf-seg:hover { background:#ece9f9 !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="randevu" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:20px 28px 30px;">
    <div style="background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); padding:18px 22px 24px;">
      <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;">
        <div style="display:flex; gap:6px; align-items:center;">
          <div class="nf-btn" onClick="{{ prevMonth }}" style="width:34px; height:34px; border-radius:8px; background:#241854; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;">‹</div>
          <div class="nf-btn" onClick="{{ nextMonth }}" style="width:34px; height:34px; border-radius:8px; background:#241854; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;">›</div>
        </div>
        <span style="font-size:20px; font-weight:800; color:#241854;">{{ monthLabel }}</span>
        <div style="flex:1;"></div>
        <select onChange="{{ onStatus }}" style="border:1px solid #d9d5ee; border-radius:9px; padding:9px 13px; font-size:13px; color:#4b4770; background:#fff; cursor:pointer;">
          <option value="">Tüm durumlar</option>
          <sc-for list="{{ statusOpts }}" as="s" hint-placeholder-count="5"><option value="{{ s.key }}">{{ s.label }}</option></sc-for>
        </select>
        <a href="RandevuListe.dc.html" class="nf-btn" style="background:#fff; border:1px solid #e6e2f5; border-radius:9px; padding:9px 16px; font-size:13px; font-weight:600; color:#4b4770;">☰ Liste</a>
        <a href="YeniRandevu.dc.html" class="nf-btn" style="background:linear-gradient(135deg,#7c3aed,#4338ca); border-radius:9px; padding:10px 16px; font-size:13px; font-weight:600; color:#fff;">＋ Yeni Randevu</a>
      </div>

      <div style="display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap;">
        <sc-for list="{{ legend }}" as="l" hint-placeholder-count="5"><span style="display:flex; align-items:center; gap:6px; font-size:12px; color:#4b4770;"><span style="width:11px; height:11px; border-radius:3px; background:{{ l.color }}; display:inline-block;"></span>{{ l.label }}</span></sc-for>
      </div>

      <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:#eceafb; border:1px solid #eceafb; border-radius:10px; overflow:hidden;">
        <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7"><div style="background:#241854; color:#fff; font-size:12px; font-weight:700; padding:10px; text-align:center;">{{ w }}</div></sc-for>
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
          <div style="{{ c.style }}">
            <div style="{{ c.numStyle }}">{{ c.day }}</div>
            <div style="display:flex; flex-direction:column; gap:3px;">
              <sc-for list="{{ c.appts }}" as="a" hint-placeholder-count="2">
                <div class="nf-appt" onClick="{{ a.open }}" style="{{ a.style }}">{{ a.label }}</div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="margin-top:18px; padding:14px 16px; background:#f8f7fc; border-radius:12px;">
        <div style="font-size:13px; font-weight:700; color:#241854; margin-bottom:8px;">Bugün müsaitlik (Enes / Abdülkadir)</div>
        <div style="font-size:12.5px; color:#4b4770; margin-bottom:10px;">{{ busyHint }}</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          <sc-for list="{{ busySlots }}" as="s" hint-placeholder-count="5">
            <div class="nf-btn" onClick="{{ s.toggle }}" style="{{ s.style }}">{{ s.label }}</div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
    <div onClick="{{ closeModal }}" style="position:fixed; inset:0; background:rgba(20,13,46,0.5); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px;">
      <div onClick="{{ stop }}" style="background:#fff; border-radius:16px; width:520px; max-width:100%; box-shadow:0 30px 70px rgba(15,10,50,0.4); overflow:hidden;">
        <div style="padding:18px 22px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f0eef8;">
          <select value="{{ modal.durum }}" onChange="{{ changeStatus }}" style="border:1px solid #d9d5ee; border-radius:9px; padding:9px 14px; font-size:13.5px; font-weight:600; color:#241854; background:#fff; cursor:pointer;">
            <sc-for list="{{ statusOpts }}" as="s" hint-placeholder-count="5"><option value="{{ s.key }}">{{ s.label }}</option></sc-for>
          </select>
          <a href="{{ modal.href }}" style="font-size:13px; font-weight:600; color:#7c3aed;">Hasta kartı →</a>
        </div>
        <div style="padding:22px;">
          <div style="display:flex; align-items:center; gap:16px; padding-bottom:16px; border-bottom:1px solid #f0eef8;">
            <div style="width:64px; height:64px; border-radius:50%; background:#eceafb; display:flex; align-items:center; justify-content:center; color:#a99fe0;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path></svg></div>
            <div><div style="font-size:18px; font-weight:800; color:#241854;">{{ modal.ad }}</div><div style="font-size:13px; color:#8b87a8; margin-top:2px;">📱 {{ modal.tel }}</div></div>
          </div>
          <div style="margin-top:16px; display:flex; flex-direction:column; gap:10px;">
            <sc-for list="{{ modal.rows }}" as="r" hint-placeholder-count="5"><div style="display:flex; justify-content:space-between; font-size:13.5px;"><span style="color:#8b87a8;">{{ r.k }}</span><span style="color:#241854; font-weight:600;">{{ r.v }}</span></div></sc-for>
          </div>
          <div class="nf-btn" onClick="{{ closeModal }}" style="margin-top:22px; background:#241854; color:#fff; border-radius:10px; padding:12px; text-align:center; font-size:14px; font-weight:600; cursor:pointer;">Kapat</div>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="padding:16px 28px; display:flex; justify-content:space-between; font-size:12px; color:#9c98b8;"><span>Nefalix 2026 © <strong style="color:#6b6785;">v160726_01</strong></span><span>Benzersiz müşteri kodunuz : <strong style="color:#6b6785;">NFX5</strong></span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1000}}">
const WD = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
const MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
class Component extends DCLogic {
  state = { ready: false, y: 0, m: 0, status: '', modalId: null, ver: 0 };
  componentDidMount() { const n = new Date(); this.setState({ ready: false, y: n.getFullYear(), m: n.getMonth() }); window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  renderVals() {
    const S = window.Nefalix ? window.Nefalix.RND_STATUS : [];
    const statusOpts = S.map(s => ({ key: s.key, label: s.label }));
    const legend = statusOpts.map((s, i) => ({ label: s.label, color: S[i].color }));
    if (!this.state.ready) return { loading: true, statusOpts, legend, weekdays: WD, cells: [], monthLabel: '' };
    const stColor = {}; S.forEach(s => stColor[s.key] = s.color);
    const stLabel = {}; S.forEach(s => stLabel[s.key] = s.label);
    let all = window.Nefalix.getRandevu();
    if (this.state.status) all = all.filter(r => r.durum === this.state.status);
    const byDate = {};
    all.forEach(r => { (byDate[r.tarih] = byDate[r.tarih] || []).push(r); });
    const y = this.state.y, m = this.state.m;
    const first = new Date(y, m, 1); let startDow = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const today = window.Nefalix.todayStr(false);
    const p = x => String(x).padStart(2, '0');
    const cells = [];
    for (let i = 0; i < startDow; i++) cells.push({ style: { background: '#faf9fe', minHeight: '110px', padding: '6px' }, numStyle: {}, day: '', appts: [] });
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = p(d) + '.' + p(m + 1) + '.' + y;
      const isToday = ds === today;
      const appts = (byDate[ds] || []).slice(0, 4).map(r => ({
        label: r.saat + ' ' + r.ad, open: () => this.setState({ modalId: r._id }),
        style: { background: stColor[r.durum] || '#9ca3af', color: '#fff', fontSize: '10.5px', fontWeight: 600, padding: '3px 6px', borderRadius: '5px', cursor: 'pointer', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }
      }));
      cells.push({
        style: { background: isToday ? '#fffbeb' : '#fff', minHeight: '110px', padding: '6px', display: 'flex', flexDirection: 'column', gap: '4px' },
        numStyle: { fontSize: '12px', fontWeight: 700, color: isToday ? '#b45309' : '#8b87a8', textAlign: 'right' },
        day: d, appts
      });
    }
    let modal = null;
    if (this.state.modalId) {
      const r = all.find(x => x._id === this.state.modalId) || window.Nefalix.getRandevu().find(x => x._id === this.state.modalId);
      if (r) modal = { durum: r.durum, ad: r.ad, tel: r.tel, href: 'KurumKarti.dc.html?id=' + encodeURIComponent(r.danisanId || ''),
        rows: [{ k: 'Saat', v: r.saat }, { k: 'Randevu Tipi', v: r.tip }, { k: 'Oda', v: r.oda }, { k: 'Doktor', v: r.doktor }, { k: 'Tarih', v: r.tarih }, { k: 'Durum', v: stLabel[r.durum] }], _id: r._id };
    }
    const u = window.Nefalix.currentUser();
    const now = new Date();
    const isoToday = now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate());
    const hours = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
    const canBusy = u && u.saha;
    const busyHint = canBusy
      ? 'Kendi meşgul saatinize tıklayın — Kader o saate randevu yazamaz.'
      : 'Enes / Abdülkadir meşgul işaretlerini burada görürsünüz.';
    const busySlots = hours.map(h => {
      const st = window.Nefalix.slotMusait(isoToday, h);
      const mineBusy = u && (st.busy.indexOf(u.id) >= 0);
      return {
        label: h + (st.musait.length ? (' · ' + st.musait.map(n => n.split(' ')[0]).join('/')) : ' · dolu'),
        style: {
          padding: '7px 10px', borderRadius: '8px', fontSize: '12px', fontWeight: 600, cursor: canBusy ? 'pointer' : 'default',
          background: mineBusy ? '#fee2e2' : (st.musait.length ? '#dcfce7' : '#e5e7eb'),
          color: mineBusy ? '#b91c1c' : '#14532d'
        },
        toggle: () => {
          if (!canBusy) return;
          window.Nefalix.setBusySlot(isoToday, h, u.id, !mineBusy);
          this.setState(s => ({ ver: s.ver + 1 }));
        }
      };
    });
    return {
      loading: false, statusOpts, legend, weekdays: WD, cells,
      monthLabel: MONTHS[m] + ' ' + y,
      prevMonth: () => { let nm = m - 1, ny = y; if (nm < 0) { nm = 11; ny--; } this.setState({ m: nm, y: ny }); },
      nextMonth: () => { let nm = m + 1, ny = y; if (nm > 11) { nm = 0; ny++; } this.setState({ m: nm, y: ny }); },
      onStatus: (e) => this.setState({ status: e.target.value }),
      modal,
      closeModal: () => this.setState({ modalId: null }),
      stop: (e) => e.stopPropagation(),
      changeStatus: (e) => { window.Nefalix.setRandevuStatus(this.state.modalId, e.target.value); this.setState(s => ({ ver: s.ver + 1 })); },
      busyHint, busySlots
    };
  }
}
</script>
</body>
</html>
