<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  .nf-btn:hover { filter:brightness(1.08); }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9; display:flex; flex-direction:column;">
  <dc-import name="NavHeader" active-page="whatsapp" hint-size="100%,132px"></dc-import>
  <div style="flex:1; padding:12px 14px 16px; display:flex; flex-direction:column; gap:10px; min-height:0;">
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#fff; border:1px solid #ece9f7; border-radius:12px; padding:10px 14px;">
      <div style="width:34px; height:34px; border-radius:9px; background:#16a34a; display:flex; align-items:center; justify-content:center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5.1-1.3A10 10 0 1012 2z"></path></svg></div>
      <div style="min-width:0;">
        <div style="font-size:15px; font-weight:700; color:#241854;">WhatsApp · Chatwoot</div>
        <div style="font-size:12px; color:#6b6785;">{{ hint }}</div>
      </div>
      <span style="background:#dcfce7; color:#15803d; font-size:12px; font-weight:600; padding:5px 12px; border-radius:20px;">Hazır inbox</span>
      <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;">
        <div class="nf-btn" onClick="{{ reload }}" style="background:#16a34a; color:#fff; padding:8px 14px; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;">Yenile</div>
        <a href="{{ openUrl }}" target="_blank" rel="noopener" class="nf-btn" style="border:1px solid #d9d5ee; color:#241854; padding:8px 14px; border-radius:8px; font-weight:600; font-size:12px;">Yeni sekmede aç</a>
      </div>
    </div>
    <div style="flex:1; min-height:calc(100vh - 200px); border-radius:14px; overflow:hidden; border:1px solid #e5e2f0; box-shadow:0 8px 28px rgba(36,24,84,0.08); background:#fff;">
      <iframe key="{{ frameKey }}" src="{{ frameSrc }}" title="Chatwoot" style="width:100%; height:100%; min-height:calc(100vh - 200px); border:0; background:#fff;" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:800}}">
class Component extends DCLogic {
  state = {
    hint: 'İsim + numara + sohbet — Chatwoot',
    frameSrc: 'https://evo.nefalix.com:8443/app',
    openUrl: 'https://evo.nefalix.com:8443/app',
    frameKey: '1'
  };
  componentDidMount() {
    this.reload();
  }
  reload() {
    const base = 'https://evo.nefalix.com:8443/app';
    const ts = Date.now();
    this.setState({
      frameSrc: base + '?t=' + ts,
      openUrl: base,
      frameKey: String(ts),
      hint: 'Chatwoot hazır inbox — giriş: enes@nefalix.com'
    });
  }
  renderVals() {
    return {
      hint: this.state.hint,
      frameSrc: this.state.frameSrc,
      openUrl: this.state.openUrl,
      frameKey: this.state.frameKey,
      reload: () => this.reload()
    };
  }
}
</script>
</body>
</html>
