<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="store.js"></script>
<style>
  body { margin:0; background:#f2f2f9; }
  a { color:#4338ca; text-decoration:none; }
  a:hover { color:#2b2280; }
  .nf-btn:hover { filter:brightness(1.07); }
  .nf-f:focus { border-color:#7c3aed !important; box-shadow:0 0 0 3px rgba(124,58,237,0.12) !important; }
</style>
</helmet>
<div style="font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; min-height:100vh; background:#f2f2f9;">
  <dc-import name="NavHeader" active-page="crm" hint-size="100%,132px"></dc-import>
  <div style="max-width:820px; margin:0 auto; padding:22px 28px 60px;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <a href="LeadListesi.dc.html" style="width:34px; height:34px; border-radius:8px; background:#fff; border:1px solid #e6e2f5; display:flex; align-items:center; justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4338ca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
      <span style="font-size:18px; font-weight:700; color:#241854;">Yeni Lead</span>
    </div>
    <sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}"><div style="background:#dcfce7; border:1px solid #86efac; color:#15803d; font-size:13.5px; border-radius:10px; padding:13px 16px; margin-bottom:16px;">✓ Lead kaydedildi. <a href="LeadListesi.dc.html" style="color:#15803d; font-weight:700;">Lead listesine dön →</a></div></sc-if>
    <div style="background:#fff; border-radius:14px; border:1px solid #ece9f7; box-shadow:0 2px 10px rgba(20,20,60,0.06); overflow:hidden;">
      <div style="background:linear-gradient(135deg,#7c3aed,#4338ca); color:#fff; padding:13px 22px; font-size:14px; font-weight:700;">＋ Lead Bilgileri</div>
      <div style="padding:22px; display:grid; grid-template-columns:1fr 1fr; gap:16px 20px;">
        <div><label style="{{ lbl }}">Ad Soyad *</label><input class="nf-f" data-k="Ad" onInput="{{ onIn }}" style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">Telefon *</label><input class="nf-f" data-k="Telefon" onInput="{{ onIn }}" placeholder="+49..." style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">Ülke</label><input class="nf-f" data-k="Ülke" onInput="{{ onIn }}" placeholder="Almanya" style="{{ inp }}" /></div>
        <div><label style="{{ lbl }}">Referans kaynağı</label><select class="nf-f" data-k="Referans kaynağı" onChange="{{ onIn }}" style="{{ inp }}"><option value="">Seçiniz</option><option>Facebook</option><option>Instagram</option><option>Google</option><option>TikTok</option><option>WhatsApp</option><option>Referans</option></select></div>
        <div><label style="{{ lbl }}">Segment</label><select class="nf-f" data-k="Segment" onChange="{{ onIn }}" style="{{ inp }}"><option>Yeni Lead</option><option>Ulaşılamadı Tekrar Aranacak</option><option>Sıcak Alacak</option><option>Bilet Bekleniyor</option><option>Analiz Verilecek</option></select></div>
        <div><label style="{{ lbl }}">Satış temsilcisi</label><select class="nf-f" data-k="Satış temsilcisi" onChange="{{ onIn }}" style="{{ inp }}"><option value="">Atanmadı</option><sc-for list="{{ reps }}" as="r" hint-placeholder-count="3"><option>{{ r }}</option></sc-for></select></div>
        <div style="grid-column:1 / -1;"><label style="{{ lbl }}">İlk not</label><textarea class="nf-f" data-k="Son müşteri notu" onInput="{{ onIn }}" style="{{ inp }} min-height:70px; resize:vertical; font-family:inherit;"></textarea></div>
      </div>
      <div style="padding:0 22px 22px; display:flex; justify-content:flex-end; gap:12px;">
        <a href="LeadListesi.dc.html" style="padding:12px 22px; border-radius:9px; border:1px solid #d9d5ee; font-size:13.5px; color:#4b4770; font-weight:600;">Vazgeç</a>
        <div class="nf-btn" onClick="{{ save }}" style="background:linear-gradient(135deg,#7c3aed,#2563eb); border-radius:9px; padding:12px 28px; font-size:13.5px; font-weight:700; color:#fff; cursor:pointer;">Lead Kaydet</div>
      </div>
    </div>
    <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}"><div style="margin-top:14px; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; font-size:13px; border-radius:9px; padding:11px 14px;">{{ err }}</div></sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:760}}">
class Component extends DCLogic {
  state = { ready: false, saved: false, err: '' };
  form = { 'Danışan tipi': 'Potansiyel Hasta', 'Segment': 'Yeni Lead' };
  componentDidMount() { window.Nefalix.ready().then(() => this.setState({ ready: true })); }
  renderVals() {
    const lbl = 'display:block; font-size:12px; font-weight:600; color:#4b4770; margin-bottom:6px;';
    const inp = 'width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #d9d5ee; border-radius:9px; font-size:13.5px; color:#241854; outline:none; background:#fff; transition:box-shadow .15s,border-color .15s;';
    let reps = [];
    if (this.state.ready) { const seen = {}; window.Nefalix.getDanisan({ size: 400 }).rows.forEach(d => { const t = d['Satış temsilcisi']; if (t) seen[t] = 1; }); reps = Object.keys(seen).slice(0, 12); if (!reps.length) reps = ['Enes Ceylan', 'Abdülkadir Yaşar']; }
    return {
      lbl, inp, reps, saved: this.state.saved, err: this.state.err,
      onIn: (e) => { this.form[e.target.getAttribute('data-k')] = e.target.value; },
      save: () => {
        if (!this.form['Ad'] || !this.form['Telefon']) { this.setState({ err: 'Ad Soyad ve Telefon zorunludur.' }); return; }
        window.Nefalix.addDanisan(this.form);
        this.setState({ saved: true, err: '' }); window.scrollTo(0, 0);
      }
    };
  }
}
</script>
</body>
</html>
